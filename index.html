function clearCustomers(){
  W.seatViews.forEach(v => v && removeCustomerView(v));
  W.leaving.forEach(removeCustomerView);
  W.seatViews = [null, null, null, null];
  W.leaving = [];
}
function removeCustomerView(v){
  scene.remove(v.g);
  if (v.bowl) scene.remove(v.bowl);
  v.el.remove();
}

function syncCustomers(seats, dt, curTray, live){
  seats.forEach((c, i) => {
    let v = W.seatViews[i];
    if (v && (!c || v.id !== c.id)){
      v.leavingDir = v.g.position.x < 0 ? -1 : 1;
      v.el.remove();
      W.leaving.push(v);
      W.seatViews[i] = v = null;
    }
    if (c && !v){
      const g = makeCustomer(c.type);
      const fromLeft = i < 2 ? Math.random() < .8 : Math.random() < .2;
      g.position.set(live ? (fromLeft ? -14 : 14) : SEAT_X[i], 0, SEAT_Z);
      scene.add(g);
      const el = document.createElement('div');
      el.className = 'cust-ui';
      $('labels').appendChild(el);
      v = W.seatViews[i] = {id: c.id, seat: i, g, el, walking: live, walkT: 0, key: null, shakeT: 0, bowl: null};
    }
    if (v) updateCustomerView(v, c, dt, curTray, live);
  });
  for (let k = W.leaving.length - 1; k >= 0; k--){
    const v = W.leaving[k];
    v.walkT += dt;
    v.g.rotation.y = v.leavingDir * Math.PI / 2;
    v.g.position.x += v.leavingDir * 7 * dt;
    v.g.position.y = Math.abs(Math.sin(v.walkT * 11)) * .12;
    const P = v.g.userData;
    P.legL.rotation.x = Math.sin(v.walkT * 11) * .6; P.legR.rotation.x = -P.legL.rotation.x;
    if (v.bowl && v.walkT > .15){ scene.remove(v.bowl); v.bowl = null; }
    if (Math.abs(v.g.position.x) > 15){ removeCustomerView(v); W.leaving.splice(k, 1); }
  }
}

function updateCustomerView(v, c, dt, curTray, live){
  const g = v.g, P = g.userData, tx = SEAT_X[v.seat];
  v.walkT += dt;
  if (v.walking){
    const dx = tx - g.position.x;
    g.position.x += Math.sign(dx) * Math.min(Math.abs(dx), 7 * dt);
    g.rotation.y = dx > 0 ? Math.PI / 2 : -Math.PI / 2;
    g.position.y = Math.abs(Math.sin(v.walkT * 11)) * .12;
    P.legL.rotation.x = Math.sin(v.walkT * 11) * .6; P.legR.rotation.x = -P.legL.rotation.x;
    if (Math.abs(dx) < .02){ v.walking = false; P.legL.rotation.x = P.legR.rotation.x = 0; }
  } else {
    g.rotation.y = lerp(g.rotation.y, 0, Math.min(1, dt * 10));
    g.position.y = c.state === 'happy' ? Math.abs(Math.sin(v.walkT * 8)) * .18 : 0;
    if (v.shakeT > 0){ v.shakeT -= dt; g.position.x = tx + Math.sin(v.walkT * 50) * .06; } else g.position.x = tx;
    g.rotation.z = c.state === 'sad' ? Math.sin(v.walkT * 3) * .05 : 0;
  }
  const hovered = W.hover && W.hover.kind === 'seat' && W.hover.i === v.seat && c.state === 'waiting';
  g.scale.setScalar(lerp(g.scale.x, hovered ? 1.07 : 1, Math.min(1, dt * 12)));

  let mood = c.type.id === 'hangover' ? 'sick' : 'normal';
  if (c.state === 'sad') mood = 'worried';
  if (c.state === 'happy') mood = {'😋': 'happy', '🙂': 'meh', '😒': 'annoyed'}[c.face] || 'happy';
  if (P.mood !== mood){ P.mood = mood; P.face.material.map = faceTex(c.type.id, mood); }
  if (c.state === 'happy' && v.bowl) P.armL.rotation.x = -.9 + Math.sin(v.walkT * 12) * .25;
  if (P.phoneLight) P.phoneLight.visible = Math.sin(v.walkT * 6) > 0;

  if (!live){ v.el.hidden = true; return; }
  const key = `${c.state}|${c.v}`;
  if (v.key !== key){
    v.key = key;
    const s = soupById(c.soup);
    let html = `<div class="line">${esc(c.line || '')}</div>`;
    if (c.state === 'waiting'){
      const tops = c.tops.length
        ? c.tops.map(t => { const T = topById(t); return `<span class="chip">${T.icon}${T.name}</span>`; }).join('')
        : `<span class="chip plain">토핑 없이</span>`;
      html += `<div class="bubble" data-seat="${v.seat}"><span class="keyhint">${keyLabel(SEAT_KEYS[v.seat])}</span>${c.type.vip ? '<span class="vip-tag">VIP</span>' : ''}<div class="o-soup">${s.icon} ${s.name}</div><div class="o-tops">${tops}</div></div>`;
    }
    v.el.innerHTML = html;
    v.el.className = 'cust-ui st-' + c.state + (c.type.vip ? ' vip' : '');
  }
  v.el.hidden = false;
  const waiting = c.state === 'waiting';
  v.el.classList.toggle('targetable', !!(waiting && curTray));
  v.el.classList.toggle('match', !!(waiting && curTray && curTray.soup === c.soup));
  place(v.el, toScreen(g.position.x, 3.75 + g.position.y, SEAT_Z), true);
}

function syncBurners(burners, dt, ct, live){
  burners.forEach((b, i) => {
    const v = W.burnerViews[i];
    if (!v) return;
    const key = b.state + '|' + (b.soup || '');
    if (v.key !== key){
      v.key = key;
      v.contents.children.filter(ch => !v.bubbles.includes(ch)).forEach(ch => v.contents.remove(ch));
      if (b.state !== 'empty') v.contents.add(makeContents(b.soup, [], .85 * .84, b.state === 'burnt'));
    }
    const pos = v.g.position;
    const cooking = b.state === 'cooking', ready = b.state === 'ready', burnt = b.state === 'burnt';
    const warn = ready && b.t > BURN_TIME * .55;
    v.flames.visible = cooking || ready;
    v.flames.children.forEach((f, k) => { f.scale.y = (cooking ? 1 : .45) * (.7 + Math.abs(Math.sin(T * 20 + k * 1.7)) * .6); });
    v.bubbles.forEach((bb, k) => {
      bb.visible = cooking || ready;
      const ph = (T * (cooking ? 1.6 : .9) + k / 6) % 1;
      bb.position.set(Math.cos(k * 2.3) * .35 * (1 - ph * .3), .04 + ph * .05, Math.sin(k * 2.3) * .35);
      bb.scale.setScalar(Math.sin(ph * Math.PI) * 1.1 + .01);
    });
    v.ring.visible = ready || burnt;
    if (ready) v.ringMat.color.set(warn ? (Math.sin(T * 14) > 0 ? 0xff3d00 : 0xffa000) : 0x4caf50);
    if (burnt) v.ringMat.color.set(0x555555);
    v.ring.scale.setScalar(ready ? 1 + Math.sin(T * 6) * .04 : 1);
    v.pot.position.x = warn ? Math.sin(T * 45) * .035 : 0;
    const hovered = W.hover && W.hover.kind === 'burner' && W.hover.i === i;
    v.scale = lerp(v.scale, hovered ? 1.08 : 1, Math.min(1, dt * 12));
    v.pot.scale.setScalar(v.scale);
    v.emitT -= dt;
    if (v.emitT <= 0 && (cooking || ready || burnt)){
      emitSteam(new THREE.Vector3(pos.x, pos.y + 1.0, pos.z), burnt, burnt ? 1.2 : 1);
      v.emitT = cooking ? .28 : ready ? .12 : .18;
    }
    if (!live){ v.label.hidden = true; return; }
    v.label.hidden = false;
    const lk = key + (warn ? 'w' : '');
    if (v.label.dataset.key !== lk){
      v.label.dataset.key = lk;
      const s = b.soup ? soupById(b.soup) : null;
      const txt = {empty: '빈 가마솥', cooking: '끓는 중...', ready: warn ? '곧 타요! 빨리!' : '완성! 클릭', burnt: '탔어요! 클릭=버리기'}[b.state];
      v.label.innerHTML = `<span class="k">${keyLabel(BURNER_KEYS[i])}</span>${s ? `${s.icon} ${s.name}` : '🍲'}<small>${txt}</small><div class="bbar"><i></i></div>`;
      v.label.className = 'plabel ' + b.state + (warn ? ' warn' : '');
    }
    const bar = v.label.querySelector('.bbar i');
    if (cooking){ bar.style.width = (b.t / ct * 100) + '%'; bar.style.background = '#f2b632'; }
    else if (ready){ bar.style.width = ((1 - b.t / BURN_TIME) * 100) + '%'; bar.style.background = warn ? '#ff5722' : '#4caf50'; }
    else { bar.style.width = burnt ? '100%' : '0'; bar.style.background = '#555'; }
    place(v.label, toScreen(pos.x, pos.y, pos.z + 1.25));
  });
}

function syncTrays(trays, sel, dt, live){
  trays.forEach((tr, i) => {
    const v = W.trayViews[i];
    if (!v) return;
    const key = tr && !v.pendingKey ? tr.soup + ':' + tr.tops.join(',') : '-';
    if (v.key !== key){
      const wasEmpty = !v.key || v.key === '-';
      v.key = key;
      v.holder.children.slice().forEach(ch => v.holder.remove(ch));
      if (key !== '-'){ v.holder.add(makeBowl(tr.soup, tr.tops, .6)); v.pop = wasEmpty ? .6 : .9; }
    }
    v.pop = lerp(v.pop, 1, Math.min(1, dt * 10));
    const hovered = W.hover && W.hover.kind === 'tray' && W.hover.i === i;
    v.scale = lerp(v.scale, hovered ? 1.06 : 1, Math.min(1, dt * 12));
    v.holder.scale.setScalar(v.pop * v.scale);
    v.sel.visible = trays.length > 1 && sel === i;
    v.emitT -= dt;
    if (tr && v.emitT <= 0){ emitSteam(new THREE.Vector3(v.g.position.x, v.g.position.y + .8, v.g.position.z), false, .6); v.emitT = .35; }
    if (!live){ v.label.hidden = true; return; }
    v.label.hidden = false;
    const lk = key + '|' + (v.sel.visible ? 1 : 0);
    if (v.label.dataset.key !== lk){
      v.label.dataset.key = lk;
      const s = tr ? soupById(tr.soup) : null;
      v.label.innerHTML = (trays.length > 1 ? `<span class="k">Tab</span>` : '') + (s ? `${s.icon} ${s.name}<small>${tr.tops.length ? tr.tops.map(t => topById(t).icon + topById(t).name).join(' ') : '토핑 없음'}</small>` : `조립대<small>빈 그릇 자리</small>`);
      v.label.className = 'plabel tray' + (v.sel.visible ? ' sel' : '') + (tr ? '' : ' empty');
    }
    place(v.label, toScreen(v.g.position.x, v.g.position.y, v.g.position.z + .85));
  });
}

function syncBins(curTray, dt){
  W.bins.forEach(b => {
    b.bounce = Math.max(0, (b.bounce || 0) - dt * 4);
    const on = curTray && curTray.tops.includes(b.id);
    const hovered = W.hover && W.hover.kind === 'top' && W.hover.id === b.id;
    b.g.position.y = TABLE_TOP + .04 + Math.sin(b.bounce * Math.PI) * .25;
    b.g.scale.setScalar(lerp(b.g.scale.x, hovered ? 1.15 : on ? 1.08 : 1, Math.min(1, dt * 12)));
  });
}

function syncStockPot(pot, boil, amount, yieldN, dt, color, boilColor){
  pot.flames.visible = !!boil;
  pot.flames.children.forEach((f, i) => { f.scale.y = .7 + Math.abs(Math.sin(T * 20 + i * 1.7)) * .6; });
  const level = amount + (boil ? boil.sets * yieldN * (boil.t / boil.dur) : 0);
  pot.broth.visible = level > 0 || !!boil;
  pot.broth.position.y = .15 + Math.min(1, level / (yieldN * 3)) * 1.05;
  pot.broth.material.color.set(boil ? boilColor : color);
  pot.bubbles.forEach((b, i) => {
    b.visible = !!boil;
    const ph = (T * 1.8 + i / 10) % 1;
    b.position.set(Math.cos(i * 2.1) * .6 * (1 - ph * .3), Math.sin(i * 2.1) * .6, .05 + ph * .06);
    b.scale.setScalar(Math.sin(ph * Math.PI) + .01);
  });
  pot.steamT -= dt;
  if (pot.steamT <= 0 && (boil || amount > 0)){
    const pp = pot.potG.position;
    emitSteam(new THREE.Vector3(pp.x, pp.y + 1.7, pp.z), false, boil ? 1.6 : 1);
    pot.steamT = boil ? .09 : .4;
  }
}

// 냉장고는 점심 영업 중에도 보이므로 따로 갱신 (영업 중 고기가 줄어드는 게 보임)
function syncFridge(dt){
  const P = W.prep;
  P.fridgeT = Math.max(0, P.fridgeT - dt);
  const hov = W.mode === 'prep' && W.hover && W.hover.kind === 'prep' && W.hover.id === 'fridge';
  P.fridgeOpen = lerp(P.fridgeOpen, P.fridgeT > 0 || hov ? 1 : 0, Math.min(1, dt * 6));
  P.door.rotation.y = -1.5 * P.fridgeOpen;
  const n = G ? G.stock.pork : 0;
  P.fridgeSlices.forEach((sl, i) => { sl.visible = i < n; });
}

function syncPrep(dt){
  if (!G) return;
  const P = W.prep, r = G.raw, s = G.stock, p = G.prep;
  for (const id in P.hoverObjs){
    const target = W.hover && W.hover.kind === 'prep' && W.hover.id === id ? 1.05 : 1;
    P.hov[id] = lerp(P.hov[id] || 1, target, Math.min(1, dt * 12));
    P.hoverObjs[id].forEach(o => o.scale.setScalar(P.hov[id]));
  }

  // 고기
  P.block.visible = r.pork > 0;
  P.block.scale.x = lerp(P.block.scale.x, blockScale(), Math.min(1, dt * 15));
  P.spare.forEach((sb, k) => { sb.visible = k < r.pork - 1; });
  P.chopT = Math.max(0, P.chopT - dt);
  const k = P.chopT > 0 ? 1 - P.chopT / .16 : 1;
  P.knife.rotation.x = .85 * Math.abs(Math.cos(k * Math.PI));
  P.knife.position.x = P.block.visible ? -1.0 + 1.2 * P.block.scale.x + .06 : .3;
  P.slices.forEach((sl, i) => { sl.visible = i < p.cut; });

  // 싱크대
  P.washT = Math.max(0, P.washT - dt);
  const washing = P.washT > 0;
  P.stream.visible = washing;
  for (const kind in P.sinkItems){
    const it = P.sinkItems[kind];
    it.visible = washing && P.washKind === kind;
    if (it.visible) it.position.y = .32 + Math.sin(T * 25) * .04;
  }

  // 콩나물
  const washedLeft = p.washedKong * 5 - p.kongPart;
  P.rawSprouts.forEach((sp, i) => { sp.visible = i < Math.min(40, r.kong * 8); });
  P.washedSprouts.forEach((sp, i) => { sp.visible = i < Math.min(40, washedLeft * 2); });
  P.cleanSprouts.forEach((sp, i) => { sp.visible = i < Math.min(40, s.kong * 2); });

  // 뼈 상자 (씻은 뼈는 하얗게)
  P.bonesCrate.items.forEach((b, i) => { b.visible = i < Math.min(4, r.bones + p.washedBones); tintGroup(b, i < p.washedBones ? 0xf3ecd8 : 0xd99a86); });
  P.spineCrate.items.forEach((b, i) => { b.visible = i < Math.min(4, r.spine + p.washedSpine); tintGroup(b, i < p.washedSpine ? 0xe8cdb5 : 0xc0705c); });

  // 육수솥
  syncStockPot(P.clear, p.boil, s.broth, 8, dt, 0xe9dcc0, 0xd9c49a);
  syncStockPot(P.spicyPot, p.spicyBoil, s.spicy, 5, dt, 0xc0392b, 0xa82a1c);

  // 라벨
  const live = canPrep();
  const wk = P.washKind;
  const potAt = pot => [pot.potG.position.x, pot.potG.position.y, pot.potG.position.z + 1.3];
  const info = {
    chop:   {title: '🔪 도마', key: '1', sub: r.pork > 0 ? `썰기! (도마 위 ${p.cut}인분)` : p.cut ? `다 썰었어요 · ${p.cut}인분` : '썰 고기 없음', prog: p.porkChop / chopsPer(), idle: r.pork <= 0, at: [P.board.position.x - .4, P.board.position.y, P.board.position.z + .75]},
    fridge: {title: '🧊 냉장고', key: '2', sub: p.cut > 0 ? `클릭해서 넣기! (보관 ${s.pork})` : `보관 ${s.pork}인분`, prog: 0, idle: p.cut <= 0, at: [8.75, .3, 2.7]},
    sink:   {title: '🚰 싱크대', key: '3·5·7', sub: r.kong + r.bones + r.spine > 0 ? '재료 씻기!' : '씻을 재료 없음', prog: wk ? p[wk + 'Wash'] / WASH_CLICKS[wk] : 0, idle: r.kong + r.bones + r.spine <= 0, at: [P.sink.position.x, P.sink.position.y, P.sink.position.z + .9]},
    trim:   {title: '✂️ 콩나물 다듬기', key: '4', sub: p.washedKong > 0 ? `다듬기! (${s.kong}인분)` : `다듬은 콩나물 ${s.kong}인분`, prog: p.kongPart / 5, idle: p.washedKong <= 0, at: [P.bowl.position.x, P.bowl.position.y, P.bowl.position.z + .65]},
    boil:   {title: '🍲 맑은 육수', key: '6', sub: p.boil ? '보글보글 끓는 중...' : p.washedBones > 0 ? `끓이기! (${s.broth}인분)` : `${s.broth}인분`, prog: p.boil ? p.boil.t / p.boil.dur : 0, idle: !p.boil && p.washedBones <= 0, at: potAt(P.clear)},
    spicy:  {title: '🌶️ 매운 육수', key: '8', sub: p.spicyBoil ? '보글보글 끓는 중...' : p.washedSpine > 0 ? `양념 넣고 끓이기! (${s.spicy}인분)` : `${s.spicy}인분`, prog: p.spicyBoil ? p.spicyBoil.t / p.spicyBoil.dur : 0, idle: !p.spicyBoil && p.washedSpine <= 0, at: potAt(P.spicyPot)},
  };
  for (const id in info){
    const el = P.labels[id], d = info[id];
    el.hidden = !live;
    if (!live) continue;
    const lk = d.title + d.sub + d.idle;
    if (el.dataset.key !== lk){
      el.dataset.key = lk;
      el.innerHTML = `<span class="k">${d.key}</span>${d.title}<small>${d.sub}</small><div class="bbar"><i></i></div>`;
      el.className = 'plabel prep' + (d.idle ? ' idle' : '');
    }
    el.querySelector('.bbar i').style.width = (d.prog * 100) + '%';
    place(el, toScreen(...d.at));
  }
}

// ---------------- HUD ----------------
function renderHUD(){
  if (!G) return;
  $('hudDay').textContent = `DAY ${G.day}`;
  if (G.phase === 'lunch' || G.phase === 'result'){
    const tm = Math.ceil(G.time);
    $('hudTime').textContent = G.time > 0 ? `☀️ ${Math.floor(tm / 60)}:${String(tm % 60).padStart(2, '0')}` : '🔔 마감';
    $('hudTime').classList.toggle('low', G.time > 0 && G.time <= 15);
  } else {
    $('hudTime').textContent = G.phase === 'prep' ? '🌅 새벽 준비' : '🌅 새벽';
    $('hudTime').classList.remove('low');
  }
  $('hudMoney').textContent = '💰 ' + fmt(G.money);
  $('hudMoney').classList.toggle('neg', G.money < 0);
  $('hudGoal').textContent = `🎯 100만원까지 ${Math.floor(clamp(G.money / GOAL, 0, 1) * 100)}%`;
  $('hudRep').style.width = (G.rep / 5 * 100) + '%';
  $('hudRepNum').textContent = G.rep.toFixed(1);
  const comboTxt = G.combo >= 2 ? `🔥 콤보 x${G.combo}` : '';
  if ($('hudCombo').textContent !== comboTxt) $('hudCombo').textContent = comboTxt;

  if (G.phase === 'lunch'){
    const curTray = G.trays[G.sel];
    document.querySelectorAll('[data-top]').forEach(btn => btn.classList.toggle('on', !!(curTray && curTray.tops.includes(btn.dataset.top))));
    document.querySelectorAll('[data-soup]').forEach(btn => {
      const n = Math.min(...Object.keys(soupById(btn.dataset.soup).needs).map(k => G.stock[k]));
      const txt = n > 0 ? `남은 재료 ${n}인분` : '재료 소진';
      const sm = btn.querySelector('small');
      if (sm.textContent !== txt) sm.textContent = txt;
      btn.classList.toggle('soldout', n <= 0);
    });
  } else if (G.phase === 'prep'){
    const r = G.raw, s = G.stock, p = G.prep;
    $('pi-pork').textContent = `원육 ${r.pork}근 · 도마 ${p.cut} · 냉장 ${s.pork}인분`;
    $('pi-kong').textContent = `안 씻음 ${r.kong} · 씻음 ${p.washedKong}봉지 · 다듬음 ${s.kong}인분`;
    $('pi-broth').textContent = `뼈 ${r.bones} · 씻음 ${p.washedBones}세트 · 육수 ${s.broth}인분`;
    $('pi-spicy').textContent = `등뼈 ${r.spine} · 씻음 ${p.washedSpine}세트 · ${s.spicy}인분`;
    const bars = {
      chop: p.porkChop / chopsPer(), washKong: p.kongWash / WASH_CLICKS.kong, trim: p.kongPart / 5,
      washBones: p.bonesWash / WASH_CLICKS.bones, boil: p.boil ? p.boil.t / p.boil.dur : 0,
      washSpine: p.spineWash / WASH_CLICKS.spine, spicy: p.spicyBoil ? p.spicyBoil.t / p.spicyBoil.dur : 0, fridge: 0,
    };
    PREP_ACTIONS.forEach(id => {
      const btn = document.querySelector(`[data-prep="${id}"]`);
      btn.classList.toggle('off', !prepCan(id));
      btn.querySelector('.bbar i').style.width = (bars[id] * 100) + '%';
    });
    $('prepSum').innerHTML = `만들 수 있는 국밥: 🐖 ${Math.min(s.pork, s.broth)} · 🌱 ${Math.min(s.kong, s.broth)} · 🦴 ${s.spicy}`;
  }
}

// ================= 영업 종료 / 상점 / 엔딩 =================
function goalBar(){
  const pct = Math.floor(clamp(G.money / GOAL, 0, 1) * 100);
  return `<div style="margin:8px auto;max-width:440px;background:#e2d6c0;border-radius:10px;overflow:hidden;position:relative;height:28px">
    <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#f2b632,#c62d1f)"></div>
    <div style="position:absolute;inset:0;line-height:28px;font-size:16px">🎯 목표 100만원 · ${pct}% ${G.money < GOAL ? `(${fmt(GOAL - G.money)} 남음)` : '달성!'}</div></div>`;
}

function endDay(){
  G.running = false;
  G.phase = 'result';
  const s = G.stats, rent = rentToday();
  G.money -= rent;
  const net = s.sales + s.tips - s.purchase - rent;
  G.totalProfit += net; G.totalServed += s.served; G.totalPerfect += s.perfect;
  const p = G.prep, r = G.raw, st = G.stock;
  const waste = {
    '🥩 고기': st.pork + p.cut + r.pork * 4 - p.porkPart,
    '🌱 콩나물': st.kong + p.washedKong * 5 - p.kongPart + r.kong * 5,
    '🍲 맑은 육수': st.broth + (p.washedBones + r.bones) * 8,
    '🌶️ 매운 육수': st.spicy + (p.washedSpine + r.spine) * 5,
  };
  const wasteTxt = Object.entries(waste).filter(([, n]) => n > 0).map(([k, n]) => `${k} ${n}인분`).join(' · ');
  sfx.fanfare();
  let nextBtn;
  if (G.money < 0) nextBtn = `<button class="big-btn" onclick="showEnding('bankrupt')">결과 보기...</button>`;
  else if (G.money >= GOAL) nextBtn = `<button class="big-btn" onclick="showEnding('goal')">🏆 100만원 달성! 결과 보기</button>`;
  else nextBtn = `<button class="big-btn" onclick="showShop()">업그레이드 상점 🛒</button>`;
  showOverlay(`
    <div class="card">
      <h2>🏮 DAY ${G.day} 영업 결과</h2>
      <div style="font-size:18px;color:#6b4a2a">서빙 ${s.served}명 (완벽 ${s.perfect}) · 품절로 돌아간 손님 ${s.soldout}명</div>
      <table class="sum">
        <tr><td>🍲 국밥 매출</td><td class="plus">+${fmt(s.sales)}</td></tr>
        <tr><td>💝 팁</td><td class="plus">+${fmt(s.tips)}</td></tr>
        <tr><td>🛒 새벽 재료 구입비</td><td class="minus">-${fmt(s.purchase)}</td></tr>
        <tr><td>🏠 임대료</td><td class="minus">-${fmt(rent)}</td></tr>
        <tr class="total"><td>오늘 순이익</td><td class="${net >= 0 ? 'plus' : 'minus'}">${net >= 0 ? '+' : ''}${fmt(net)}</td></tr>
      </table>
      <div class="waste">${wasteTxt ? `🗑️ 폐기된 재료: ${wasteTxt}` : '👍 재료를 남김없이 다 썼어요!'}</div>
      <div style="font-size:19px;margin-top:8px">보유 자금 <b style="color:var(--red);font-weight:normal">${fmt(G.money)}</b> · 평판 ⭐ ${G.rep.toFixed(1)}</div>
      ${goalBar()}
      ${nextBtn}
    </div>`);
}

function showShop(){
  sfx.click();
  const cards = UPGRADES.map(u => {
    const lv = G.up[u.id], max = u.costs.length, cost = u.costs[lv];
    const dots = Array.from({length: max}, (_, k) => `<i class="${k < lv ? 'on' : ''}"></i>`).join('');
    const btn = lv >= max
      ? `<button class="buy" disabled>최대 레벨</button>`
      : `<button class="buy" ${G.money < cost ? 'disabled' : ''} onclick="buy('${u.id}')">${fmt(cost)}</button>`;
    return `<div class="up-card ${lv >= max ? 'maxed' : ''}"><div class="up-ic">${u.icon}</div><div class="up-name">${u.name}</div><div class="up-desc">${u.desc}</div><div class="dots">${dots}</div>${btn}</div>`;
  }).join('');
  showOverlay(`
    <div class="card wide">
      <h2>🛒 업그레이드 상점</h2>
      <div class="shop-money">보유 자금 <b>${fmt(G.money)}</b> · 평판 ⭐ ${G.rep.toFixed(1)}</div>
      <div style="font-size:15px;color:#8a6e55;margin-bottom:8px">💡 업그레이드에 돈을 쓰면 100만원이 멀어져요. 내일 재료 살 돈도 남겨두세요!</div>
      <div class="shop-grid">${cards}</div>
      <button class="big-btn" onclick="nextDay()">DAY ${G.day + 1} 준비하기 ▶</button>
    </div>`);
}

function buy(id){
  const u = UPGRADES.find(x => x.id === id), lv = G.up[id], cost = u.costs[lv];
  if (cost == null || G.money < cost){ sfx.err(); return; }
  G.money -= cost; G.up[id]++;
  if (id === 'sign') G.rep = clamp(G.rep + 0.5, 0, 5);
  sfx.coin();
  showShop();
}

function nextDay(){
  G.day++;
  sfx.click();
  showDayIntro();
}

function showEnding(reason){
  G.running = false;
  G.phase = 'result';
  const d = G.day;
  let grade;
  if (reason === 'rep') grade = {e: '🥀', t: '폐업... 손님이 발길을 끊었어요', d: '평판이 바닥났어요. 국밥은 정성입니다!'};
  else if (reason === 'bankrupt') grade = {e: '💸', t: '파산... 임대료를 못 냈어요', d: '재료 구입비와 임대료 관리가 중요해요.'};
  else {
    grade = d <= 6  ? {e: '👑', t: '국밥 프랜차이즈 회장님', d: `단 ${d}일 만에 100만원! 전국에 지점이 생겼어요!`}
          : d <= 9  ? {e: '🔥', t: '줄 서는 국밥 명소', d: `${d}일 만에 100만원 달성! 방송 출연 섭외가 들어왔어요.`}
          : d <= 13 ? {e: '🍲', t: '동네 단골 맛집', d: `${d}일 동안 차곡차곡 모아 100만원 달성!`}
          :           {e: '😅', t: '끈기의 국밥집', d: `${d}일간의 노력 끝에 100만원 달성! 포기하지 않았어요.`};
    sfx.fanfare();
  }
  const best = loadBest();
  let newRecord = false;
  if (reason === 'goal' && (!best || !best.days || d < best.days)){
    saveBest({name: G.name, days: d, grade: grade.t});
    newRecord = true;
  }
  const done = reason === 'goal';
  showOverlay(`
    <div class="card">
      <div style="font-size:20px;color:#8a6e55">${esc(G.name)} · ${done ? `DAY ${d} 목표 달성` : `DAY ${d}에서 종료`}</div>
      <div class="ending-ic">${grade.e}</div>
      <div class="ending-title">${grade.t}</div>
      <div class="day-note">${grade.d}</div>
      ${newRecord ? '<div class="unlock">🏆 최단 기록 갱신!</div>' : ''}
      <table class="sum">
        <tr><td>걸린 날짜</td><td>${d}일</td></tr>
        <tr><td>최종 자금</td><td>${fmt(G.money)}</td></tr>
        <tr><td>서빙한 손님</td><td>${G.totalServed + (G.phase === 'result' && !done ? G.stats.served : 0)}명</td></tr>
        <tr><td>완벽한 국밥</td><td>${G.totalPerfect + (!done ? G.stats.perfect : 0)}그릇</td></tr>
        <tr><td>최종 평판</td><td>⭐ ${G.rep.toFixed(1)}</td></tr>
      </table>
      <button class="big-btn" onclick="showTitle()">다시 하기 🔄</button>
    </div>`);
}

function togglePause(){
  if (!inPhase('lunch') || (!G.running && !G.paused)) return;
  G.paused = !G.paused;
  G.running = !G.paused;
  if (G.paused){
    const waiting = G.seats.filter(c => c && c.state === 'waiting').length;
    showOverlay(`
      <div class="card">
        <h2>⏸ 일시정지</h2>
        <div class="keys-help" style="font-size:16px">Q W E 국밥 · A S D F 가마솥 · 1~4 토핑 · Z X C V 서빙 · Tab 조립대 전환 · Backspace 버리기</div>
        <button class="big-btn" onclick="togglePause()">계속하기 ▶</button><br>
        ${G.time <= 0 && waiting ? `<button class="sub-btn" onclick="closeEarly()">🙇 남은 손님께 사과하고 마감 (평판 -0.2/명)</button><br>` : ''}
        <button class="sub-btn" onclick="showTitle()">처음으로</button>
      </div>`);
  } else hideOverlay();
}
function closeEarly(){
  G.seats.forEach((c, i) => {
    if (c && c.state === 'waiting'){ G.stats.soldout++; G.rep = clamp(G.rep - 0.2, 0, 5); }
    G.seats[i] = null;
  });
  G.paused = false;
  G.running = true;
  hideOverlay();
  if (G.rep <= 0){ G.running = false; showEnding('rep'); return; }
  endDay();
}

// ================= 오버레이 / 이펙트 =================
function showOverlay(html, light = false){
  const o = $('overlay');
  o.innerHTML = html;
  o.classList.toggle('light', light);
  o.hidden = false;
}
function hideOverlay(){ $('overlay').hidden = true; $('overlay').innerHTML = ''; }

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}
function floatWorld(x, y, z, text, color, dy = 0){
  const p = toScreen(x, y, z);
  const f = document.createElement('div');
  f.className = 'float';
  f.textContent = text;
  f.style.color = color;
  f.style.left = p.x + 'px';
  f.style.top = (p.y + dy) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1250);
}

// ================= 입력 =================
const _ptr = new THREE.Vector2();
function pickAt(cx, cy){
  _ptr.set(cx / window.innerWidth * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(_ptr, camera);
  const list = W.mode === 'prep' ? W.prep.hits : [...W.seatHits, ...W.binHits, ...W.burnerViews.map(v => v.hit), ...W.trayViews.map(v => v.hit)];
  const hits = raycaster.intersectObjects(list, false);
  return hits.length ? hits[0].object.userData : null;
}
function handleHit(u){
  if (u.kind === 'prep') prepAction(u.id);
  else if (u.kind === 'burner') clickBurner(u.i);
  else if (u.kind === 'tray'){ if (u.i < G.trays.length){ G.sel = u.i; sfx.click(); } }
  else if (u.kind === 'seat') serve(u.i);
  else if (u.kind === 'top') toggleTop(u.id);
}

document.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const t = e.target;
  if (canPrep()){
    let el;
    if (t === renderer.domElement){ const u = pickAt(e.clientX, e.clientY); if (u && u.kind === 'prep') handleHit(u); }
    else if ((el = t.closest('[data-prep]'))) prepAction(el.dataset.prep);
    else if (t.closest('#startLunchBtn')) startLunch();
    return;
  }
  if (!canAct()) return;
  if (t === renderer.domElement){ const u = pickAt(e.clientX, e.clientY); if (u) handleHit(u); return; }
  let el;
  if ((el = t.closest('[data-soup]'))) orderSoup(el.dataset.soup);
  else if ((el = t.closest('[data-top]'))) toggleTop(el.dataset.top);
  else if ((el = t.closest('[data-seat]'))) serve(+el.dataset.seat);
  else if (t.closest('#trashBtn')) trashTray();
});
document.addEventListener('pointermove', e => {
  if (!(canAct() || canPrep()) || e.target !== renderer.domElement){ W.hover = null; renderer.domElement.style.cursor = ''; return; }
  W.hover = pickAt(e.clientX, e.clientY);
  renderer.domElement.style.cursor = W.hover ? 'pointer' : '';
});

$('pauseBtn').addEventListener('click', togglePause);
$('muteBtn').addEventListener('click', () => { muted = !muted; $('muteBtn').textContent = muted ? '🔇' : '🔊'; });

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const c = e.code;
  if (canPrep()){
    const m = /^(?:Digit|Numpad)([1-8])$/.exec(c);
    if (m) prepAction(PREP_ACTIONS[+m[1] - 1]);
    else if (c === 'Enter' || c === 'NumpadEnter'){ e.preventDefault(); if (!e.repeat) startLunch(); }
    return;
  }
  if (c === 'Escape' || c === 'KeyP'){ togglePause(); return; }
  if (!canAct()) return;
  let n;
  if ((n = SOUP_KEYS.indexOf(c)) >= 0) orderSoup(SOUPS[n].id);
  else if ((n = BURNER_KEYS.indexOf(c)) >= 0){ if (n < G.burners.length) clickBurner(n); }
  else if ((n = SEAT_KEYS.indexOf(c)) >= 0) serve(n);
  else if (/^Digit[1-4]$/.test(c)) toggleTop(TOPPINGS[+c.slice(5) - 1].id);
  else if (c === 'Tab'){ e.preventDefault(); G.sel = (G.sel + 1) % G.trays.length; sfx.click(); }
  else if (c === 'Backspace' || c === 'Delete'){ e.preventDefault(); trashTray(); }
});

document.addEventListener('visibilitychange', () => { if (document.hidden && canAct()) togglePause(); });

// ================= 메인 루프 =================
let last = 0;
const _camTarget = new THREE.Vector3();
function loop(ts){
  const dt = Math.min(0.1, (ts - last) / 1000 || 0);
  last = ts;
  T += dt;
  if (canAct()) update(dt);
  if (inPhase('prep')) updatePrep(dt);

  const overlayOpen = !$('overlay').hidden;
  const frozen = G && G.paused;
  const fdt = frozen ? 0 : dt;

  if (W.mode === 'lunch'){
    const real = !!G;
    const seats = real ? G.seats : DEMO.seats;
    const burners = real ? G.burners : DEMO.burners;
    const trays = real ? G.trays : DEMO.trays;
    const sel = real ? G.sel : 0;
    if (!real) DEMO.burners[1].t = T % 7;
    const curTray = trays[sel];
    syncCustomers(seats, fdt, real ? curTray : null, real);
    syncBurners(burners, fdt, real ? cookTime() : 7, real);
    syncTrays(trays, sel, fdt, real);
    syncBins(real ? curTray : null, fdt);
  } else {
    syncPrep(dt);
  }
  syncFridge(dt);
  if (!frozen) updateFx(dt);
  renderHUD();
  $('labels').style.visibility = overlayOpen ? 'hidden' : 'visible';

  W.lanterns.forEach((l, k) => { l.rotation.z = Math.sin(T * 1.2 + k * 2) * .06; });
  W.clockHand.rotation.z = -T * .5;

  // 조명 (새벽 ↔ 점심)
  const Lt = LIGHTS[W.mode], lk = Math.min(1, dt * 2);
  scene.background.lerp(Lt.bg, lk);
  scene.fog.color.copy(scene.background);
  W.hemi.color.lerp(Lt.hemi, lk);
  W.hemi.intensity = lerp(W.hemi.intensity, Lt.hemiI, lk);
  W.sun.color.lerp(Lt.sun, lk);
  W.sun.intensity = lerp(W.sun.intensity, Lt.sunI, lk);

  // 카메라
  const cam = CAMS[W.mode];
  _camTarget.copy(cam.pos);
  if (overlayOpen){ _camTarget.x += Math.sin(T * .25) * 2.2; _camTarget.y += Math.sin(T * .17) * .4; }
  camera.position.lerp(_camTarget, Math.min(1, dt * 2.5));
  curLook.lerp(cam.look, Math.min(1, dt * 2.5));
  if (W.shake > 0){ W.shake = Math.max(0, W.shake - dt); camera.position.x += (Math.random() - .5) * W.shake * .6; camera.position.y += (Math.random() - .5) * W.shake * .6; }
  camera.lookAt(curLook);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

init3D();
showTitle();
camera.position.copy(CAMS.lunch.pos);
requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { redrawTex(W.menuTex); redrawTex(W.signTex); });
</script>
