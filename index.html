<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국밥 타이쿤 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --wood3:#4a2c18; --cream:#fff3dc; --paper:#fdf6e8;
  --red:#c62d1f; --red2:#8e1c12; --ink:#2a1a10; --gold:#f2b632; --green:#4caf50;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#1c120b;font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;padding:8px 14px;background:linear-gradient(rgba(25,14,8,.92),rgba(25,14,8,.55) 75%,transparent);color:var(--cream);font-size:20px;flex-wrap:wrap;pointer-events:none}
#hud > *{pointer-events:auto}
.hud-name{color:var(--gold);font-size:24px;margin-right:auto;white-space:nowrap;text-shadow:0 2px 0 #000}
.hud-item{background:rgba(0,0,0,.45);padding:4px 12px;border-radius:10px;white-space:nowrap}
.hud-item.neg{color:#ff7b6b}
.timer.low{color:#ff6b5b;animation:blink 1s infinite}
.combo{background:#c62d1f;color:#fff;animation:pop .3s}
.combo:empty{display:none}
.stars{position:relative;display:inline-block}
.stars .bg{color:#6a5646}
.stars .fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold)}
.icon-btn{background:rgba(0,0,0,.45);border:none;color:var(--cream);font-size:18px;border-radius:10px;padding:5px 10px}
.icon-btn:hover{background:rgba(255,255,255,.2)}

/* ---------- 3D 라벨 ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.cust-ui{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.cust-ui .line{font-size:15px;color:#4a2c18;background:rgba(255,255,255,.85);padding:2px 10px;border-radius:10px;margin-bottom:5px;white-space:nowrap}
.cust-ui .line:empty{display:none}
.cust-ui.st-waiting .line{animation:lineFade 3.8s forwards}
.cust-ui.st-happy .line{font-size:18px;animation:pop .3s}
.cust-ui.st-sad .line{font-size:18px;background:#dbe9ff;color:#1d4e9a;animation:pop .3s}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 9px 7px;text-align:center;position:relative;margin-bottom:10px;min-width:130px;box-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:auto;cursor:pointer;transition:background .15s}
.bubble:after{content:'';position:absolute;bottom:-10px;left:50%;margin-left:-8px;border-width:9px 8px 0;border-style:solid;border-color:var(--ink) transparent transparent}
.o-soup{font-size:19px;white-space:nowrap}
.o-tops{font-size:14px;color:#6b5040;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:3px;max-width:190px}
.chip{background:#f3e6cf;border-radius:6px;padding:1px 5px;white-space:nowrap}
.chip.plain{background:#eee;color:#888}
.cust-ui.vip .bubble{border-color:#d4145a;background:#fff0f6}
.cust-ui.vip .bubble:after{border-top-color:#d4145a}
.vip-tag{position:absolute;right:-10px;top:-12px;background:#d4145a;color:#fff;font-size:13px;padding:0 6px;border-radius:6px;transform:rotate(12deg)}
.cust-ui.targetable .bubble{box-shadow:0 0 0 4px var(--gold),0 4px 0 rgba(0,0,0,.25)}
.cust-ui.match .bubble{background:#eaffd9}
.cust-ui .keyhint{position:absolute;left:-10px;top:-10px;background:var(--ink);color:#fff;border-radius:6px;padding:0 6px;font-size:13px}
.plabel{position:absolute;left:0;top:0;background:rgba(20,12,8,.78);color:#eee;border-radius:10px;padding:3px 10px 5px;font-size:15px;text-align:center;white-space:nowrap;min-width:90px;will-change:transform}
.plabel small{display:block;font-size:13px;color:#bbb}
.plabel .bbar{height:7px;background:#000;border-radius:5px;overflow:hidden;margin-top:3px}
.plabel .bbar i{display:block;height:100%;width:0;background:var(--gold)}
.plabel .k{position:absolute;left:-8px;top:-8px;background:#eee;color:#222;border-radius:5px;padding:0 5px;font-size:12px}
.plabel.ready{border:2px solid var(--green)} .plabel.ready small{color:#9f9}
.plabel.warn{border:2px solid #ff8a1e;animation:shake .5s infinite} .plabel.warn small{color:#ffb35c}
.plabel.burnt small{color:#ff7b6b}
.plabel.empty{opacity:.55}
.plabel.tray{background:rgba(90,55,25,.85)}
.plabel.tray.sel{border:2px solid var(--gold)}
.plabel.prep{background:rgba(30,40,70,.85);border:2px solid #8fb0ff}
.plabel.prep.idle{opacity:.5;border-color:transparent}
@media (max-width:1000px){.plabel{font-size:12px;padding:2px 6px 4px;min-width:70px}.plabel small{font-size:11px}}

/* ---------- 하단 조작부 ---------- */
.controls{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:8px 10px 10px;background:linear-gradient(transparent,rgba(20,12,8,.85) 35%);flex-wrap:wrap}
.cgroup{display:flex;flex-direction:column;gap:4px}
.ctitle{color:var(--gold);font-size:15px;padding-left:4px;text-shadow:0 2px 0 #000}
.crow{display:flex;gap:6px}
.cbtn{width:92px;background:var(--paper);border:none;border-radius:12px;padding:5px 3px 6px;font-size:15px;box-shadow:0 5px 0 #b99b72;position:relative;color:var(--ink);line-height:1.1}
.cbtn:hover{background:#fff;transform:translateY(-2px)}
.cbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b99b72}
.cbtn .ic{font-size:26px;display:block;line-height:1.2}
.cbtn small{display:block;font-size:11px;color:#8a6e55}
.cbtn .key{position:absolute;right:4px;top:3px;font-size:11px;background:rgba(0,0,0,.12);border-radius:4px;padding:0 4px;color:#6b5040}
.cbtn.on{background:#ffd966;box-shadow:0 5px 0 #c79a1e}
.cbtn.locked,.cbtn.soldout{opacity:.4;filter:grayscale(1);cursor:not-allowed}
.cbtn.soldout small{color:#c62d1f}
.cbtn.trash{background:#7a2e22;color:#fff;box-shadow:0 5px 0 #3d140e}
.cbtn.trash small{color:#fcc}
.pgroup{background:rgba(0,0,0,.4);border-radius:12px;padding:4px 6px 6px;display:flex;flex-direction:column;gap:3px}
.pg-title{color:var(--gold);font-size:15px;text-shadow:0 2px 0 #000}
.pg-info{color:#eee;font-size:12px;white-space:nowrap}
.pstep{width:88px;background:var(--paper);border:none;border-radius:10px;padding:4px 3px 5px;box-shadow:0 4px 0 #b99b72;position:relative;color:var(--ink);font-size:14px;line-height:1.1}
.pstep:hover{background:#fff;transform:translateY(-2px)}
.pstep:active{transform:translateY(3px);box-shadow:0 1px 0 #b99b72}
.pstep .ic{font-size:22px;display:block}
.pstep .key{position:absolute;right:3px;top:2px;font-size:10px;background:rgba(0,0,0,.12);border-radius:4px;padding:0 3px;color:#6b5040}
.pstep .bbar{height:5px;background:#e2d6c0;border-radius:4px;overflow:hidden;margin-top:3px}
.pstep .bbar i{display:block;height:100%;width:0;background:var(--gold)}
.pstep.off{opacity:.45}
.pcard{width:158px;background:var(--paper);border:none;border-radius:12px;padding:6px 8px 8px;box-shadow:0 5px 0 #b99b72;position:relative;color:var(--ink);text-align:center;font-size:17px;line-height:1.15}
.pcard:hover{background:#fff;transform:translateY(-2px)}
.pcard:active{transform:translateY(3px);box-shadow:0 2px 0 #b99b72}
.pcard .ic{font-size:30px;display:block}
.pcard small{display:block;font-size:13px;color:#6b4a2a;min-height:16px;margin-top:2px}
.pcard .key{position:absolute;right:5px;top:4px;font-size:11px;background:rgba(0,0,0,.12);border-radius:4px;padding:0 4px;color:#6b5040}
.pcard .bbar{height:7px;background:#e2d6c0;border-radius:5px;overflow:hidden;margin-top:4px}
.pcard .bbar i{display:block;height:100%;width:0;background:var(--gold)}
.pcard.done{opacity:.55}
.prep-sum{color:var(--cream);font-size:16px;text-align:center;text-shadow:0 2px 0 #000}
.start-btn{background:var(--red);color:#fff;border:none;font-size:22px;padding:12px 22px;border-radius:14px;box-shadow:0 6px 0 var(--red2);position:relative}
.start-btn:hover{filter:brightness(1.1)}
.start-btn .key{font-size:11px;background:rgba(0,0,0,.2);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}

/* ---------- 오버레이 ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,10,5,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(2px)}
.overlay.light{background:rgba(20,10,5,.25);backdrop-filter:none}
.card{background:var(--paper);border-radius:22px;border:5px solid var(--wood3);padding:22px 28px;max-width:680px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.35);text-align:center;animation:popIn .3s}
.card.wide{max-width:860px}
.card h2{margin:0 0 8px;font-weight:normal;font-size:32px;color:var(--wood3)}
.big-btn{background:var(--red);color:#fff;border:none;font-size:25px;padding:12px 36px;border-radius:14px;box-shadow:0 6px 0 var(--red2);margin-top:14px}
.big-btn:hover{filter:brightness(1.1)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red2)}
.big-btn:disabled{background:#999;box-shadow:0 6px 0 #666;cursor:not-allowed;filter:none}
.sub-btn{background:#e8d9c0;color:var(--ink);border:none;font-size:18px;padding:9px 22px;border-radius:12px;box-shadow:0 4px 0 #b99b72;margin:10px 4px 0}
.sign{display:inline-block;background:var(--red);color:#fff;font-size:52px;padding:6px 34px;border-radius:14px;border:5px solid #fff3dc;box-shadow:0 0 0 5px var(--red),0 10px 0 5px rgba(0,0,0,.3);margin:10px 0 16px;letter-spacing:2px}
.sign sup{font-size:24px;color:var(--gold)}
.subtitle{font-size:20px;color:#6b4a2a;margin:6px 0 14px}
.name-row{font-size:20px;margin:6px 0}
.name-row input{font-family:inherit;font-size:20px;padding:6px 12px;border-radius:10px;border:3px solid var(--wood3);width:200px;text-align:center;background:#fff}
.howto{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 8px;text-align:left}
.step{background:#f3e6cf;border-radius:12px;padding:8px 12px;font-size:16px;color:#4a2c18}
.step b{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;text-align:center;line-height:24px;margin-right:6px;font-weight:normal}
.step em{font-style:normal;color:var(--red)}
.keys-help{font-size:14px;color:#8a6e55;margin-top:6px}
.best{margin-top:10px;font-size:17px;color:#7a5a30}
.day-big{font-size:72px;color:var(--red);line-height:1;margin:6px 0}
.day-note{font-size:21px;color:#4a2c18;margin:10px 0}
.day-flow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0;font-size:17px}
.day-flow span{background:#f3e6cf;border-radius:10px;padding:4px 10px}
.unlock{display:inline-block;background:#fff0c2;border:3px solid var(--gold);border-radius:12px;padding:6px 14px;margin:4px;font-size:19px;animation:pop .4s}
.sum{width:100%;max-width:420px;margin:10px auto;border-collapse:collapse;font-size:19px}
.sum td{padding:5px 8px;border-bottom:2px dashed #e2d2b6}
.sum td:last-child{text-align:right}
.sum .plus{color:#2e7d32}.sum .minus{color:#c62d1f}
.sum tr.total td{font-size:24px;border-bottom:none;padding-top:10px}
.waste{font-size:16px;color:#7a5a40;background:#f3e6cf;border-radius:10px;padding:6px 10px;display:inline-block}
.shop-money{font-size:20px;margin-bottom:10px}
.shop-money b{color:var(--red);font-weight:normal;font-size:24px}
.shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.up-card{background:#f3e6cf;border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.up-card.maxed{opacity:.6}
.up-ic{font-size:36px}
.up-name{font-size:19px;color:var(--wood3)}
.up-desc{font-size:14px;color:#7a5a40;min-height:34px}
.dots{display:flex;gap:4px;margin:3px 0}
.dots i{width:12px;height:12px;border-radius:50%;background:#d8c4a2}
.dots i.on{background:var(--gold)}
.buy{background:#3f8f47;color:#fff;border:none;border-radius:10px;padding:6px 14px;font-size:17px;box-shadow:0 4px 0 #245a2a;margin-top:auto}
.buy:disabled{background:#aaa;box-shadow:0 4px 0 #777;cursor:not-allowed}
.ending-ic{font-size:96px;line-height:1.1;animation:bounce .6s infinite alternate}
.ending-title{font-size:36px;color:var(--red);margin:6px 0}
.mk-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.mk-row{display:grid;grid-template-columns:52px 1fr 120px 150px 100px;align-items:center;gap:8px;background:#f3e6cf;border-radius:14px;padding:8px 14px;text-align:left}
.mk-ic{font-size:38px;text-align:center}
.mk-name{font-size:21px}
.mk-name small{display:block;font-size:14px;color:#8a6e55}
.mk-price{font-size:17px;color:#6b4a2a}
.mk-qty{display:flex;align-items:center;justify-content:center;gap:10px;font-size:24px}
.mk-qty span{min-width:54px;text-align:center;white-space:nowrap}
.qty{width:40px;height:40px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:26px;line-height:1;box-shadow:0 3px 0 var(--red2);padding:0}
.qty:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red2)}
.mk-sub{text-align:right;font-size:18px}
.mk-info{font-size:17px;color:#4a2c18;background:#fff0c2;border-radius:10px;padding:6px 10px}
.mk-total{font-size:21px;margin-top:10px}
.mk-total b{color:var(--red);font-weight:normal}
.mk-warn{color:#c62d1f;font-size:16px;min-height:20px;margin-top:4px}

#toast{position:fixed;top:64px;left:50%;transform:translate(-50%,-20px);background:rgba(30,18,10,.92);color:var(--cream);padding:10px 22px;border-radius:14px;font-size:20px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;border:2px solid var(--gold);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.float{position:fixed;pointer-events:none;font-size:26px;color:var(--gold);text-shadow:0 2px 0 #000,0 0 6px #000;animation:floatUp 1.2s forwards;z-index:60;transform:translate(-50%,0);white-space:nowrap}
#loadError{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff3dc;font-size:22px;text-align:center;z-index:100;background:#1c120b;padding:20px;line-height:1.6}

@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes floatUp{to{transform:translate(-50%,-70px);opacity:0}}
@keyframes blink{50%{opacity:.4}}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-4px 0}75%{translate:4px 0}}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes lineFade{0%,80%{opacity:1}100%{opacity:0}}

@media (max-width:1000px){
  .cbtn{width:66px;font-size:12px}
  .cbtn .ic{font-size:20px}
  .cbtn small{display:none}
  .pcard{width:120px;font-size:14px}
  .shop-grid{grid-template-columns:repeat(2,1fr)}
  .howto{grid-template-columns:1fr}
  .bubble{min-width:100px;padding:3px 6px}
  .o-soup{font-size:15px}
  .o-tops{font-size:11px;max-width:130px}
  .mk-row{grid-template-columns:40px 1fr 120px;}
  .mk-price,.mk-sub{display:none}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>
<div id="hud">
  <div class="hud-name" id="hudName">🍲 국밥 타이쿤 3D</div>
  <div class="hud-item" id="hudDay">DAY 1</div>
  <div class="hud-item timer" id="hudTime">⏱ 1:30</div>
  <div class="hud-item" id="hudMoney">💰 0원</div>
  <div class="hud-item" id="hudGoal">🎯 100만원</div>
  <div class="hud-item"><span class="stars"><span class="bg">★★★★★</span><span class="fg" id="hudRep">★★★★★</span></span> <span id="hudRepNum">3.0</span></div>
  <div class="hud-item combo" id="hudCombo"></div>
  <button class="icon-btn" id="muteBtn" title="소리 켜기/끄기">🔊</button>
  <button class="icon-btn" id="pauseBtn" title="일시정지 (Esc)">⏸</button>
</div>
<div class="controls" id="lunchControls">
  <div class="cgroup"><div class="ctitle">🥘 국밥 — 눌러서 가마솥에 끓이기</div><div class="crow" id="soups"></div></div>
  <div class="cgroup"><div class="ctitle">🧂 토핑 — 조립대 그릇에 올리기</div><div class="crow" id="toppings"></div></div>
  <div class="cgroup"><div class="ctitle">&nbsp;</div><div class="crow"><button class="cbtn trash" id="trashBtn"><span class="ic">🗑️</span>버리기<small>Backspace</small></button></div></div>
</div>
<div class="controls" id="prepControls" hidden>
  <div class="pgroup">
    <div class="pg-title">🥩 돼지고기</div><div class="pg-info" id="pi-pork"></div>
    <div class="crow">
      <button class="pstep" data-prep="chop"><span class="key">1</span><span class="ic">🔪</span>썰기<div class="bbar"><i></i></div></button>
      <button class="pstep" data-prep="fridge"><span class="key">2</span><span class="ic">🧊</span>냉장고에<div class="bbar"><i></i></div></button>
    </div>
  </div>
  <div class="pgroup">
    <div class="pg-title">🌱 콩나물</div><div class="pg-info" id="pi-kong"></div>
    <div class="crow">
      <button class="pstep" data-prep="washKong"><span class="key">3</span><span class="ic">🚿</span>씻기<div class="bbar"><i></i></div></button>
      <button class="pstep" data-prep="trim"><span class="key">4</span><span class="ic">✂️</span>다듬기<div class="bbar"><i></i></div></button>
    </div>
  </div>
  <div class="pgroup">
    <div class="pg-title">🍲 맑은 육수</div><div class="pg-info" id="pi-broth"></div>
    <div class="crow">
      <button class="pstep" data-prep="washBones"><span class="key">5</span><span class="ic">🚿</span>뼈 씻기<div class="bbar"><i></i></div></button>
      <button class="pstep" data-prep="boil"><span class="key">6</span><span class="ic">🔥</span>끓이기<div class="bbar"><i></i></div></button>
    </div>
  </div>
  <div class="pgroup">
    <div class="pg-title">🌶️ 매운 육수 (뼈해장국)</div><div class="pg-info" id="pi-spicy"></div>
    <div class="crow">
      <button class="pstep" data-prep="washSpine"><span class="key">7</span><span class="ic">🚿</span>등뼈 씻기<div class="bbar"><i></i></div></button>
      <button class="pstep" data-prep="spicy"><span class="key">8</span><span class="ic">🌶️</span>양념+끓이기<div class="bbar"><i></i></div></button>
    </div>
  </div>
  <div class="cgroup">
    <div class="prep-sum" id="prepSum"></div>
    <button class="start-btn" id="startLunchBtn">☀️ 점심 영업 시작<span class="key">Enter</span></button>
  </div>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast"></div>

<script>
if (typeof THREE === 'undefined'){
  document.body.insertAdjacentHTML('beforeend', `<div id="loadError">😢 3D 엔진(Three.js)을 불러오지 못했어요.<br>인터넷 연결을 확인한 뒤 새로고침 해주세요.</div>`);
  throw new Error('THREE not loaded');
}

// ================= 데이터 =================
const DAY_LEN = 90, SEAT_COUNT = 4, BURN_TIME = 9, START_MONEY = 300000, GOAL = 1000000;

function pickWeighted(arr, wf){
  const total = arr.reduce((s, x) => s + wf(x), 0);
  let r = Math.random() * total;
  for (const x of arr){ r -= wf(x); if (r <= 0) return x; }
  return arr[arr.length - 1];
}

let AC = null, muted = false;
function tone(f, d, type = 'sine', v = 0.08, f2 = null, delay = 0){
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch(e){}
}

const matCache = {};
function std(color, o = {}){
  const key = color + JSON.stringify(o);
  if (!matCache[key]) matCache[key] = new THREE.MeshStandardMaterial(Object.assign({color, roughness: 0.7}, o));
  return matCache[key];
}
function mesh(geo, mat, x = 0, y = 0, z = 0, shadow = true){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  return m;
}
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  t.userData = {canvas: c, ctx, draw};
  return t;
}
function redrawTex(t){
  const {canvas, ctx, draw} = t.userData;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  draw(ctx, canvas.width, canvas.height);
  t.needsUpdate = true;
}
const GEO = {};
function geo(key, make){ return GEO[key] || (GEO[key] = make()); }
const hitMat = new THREE.MeshBasicMaterial({visible: false});
function hitBox(w, h, d, x, y, z, data){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), hitMat);
  m.position.set(x, y, z); m.userData = data;
  return m;
}

function woodTex(base, line, n = 8, vertical = false){
  const t = canvasTex(512, 512, (x, w, h) => {
    x.fillStyle = base; x.fillRect(0, 0, w, h);
    const L = vertical ? w : h;
    for (let i = 0; i < n; i++){
      const p = i * L / n;
      x.fillStyle = `rgba(0,0,0,${0.03 + prand(i) * 0.12})`;
      vertical ? x.fillRect(p, 0, L / n, h) : x.fillRect(0, p, w, L / n);
      x.fillStyle = line;
      vertical ? x.fillRect(p, 0, 4, h) : x.fillRect(0, p, w, 4);
    }
    x.strokeStyle = 'rgba(0,0,0,.07)';
    for (let k = 0; k < 70; k++){
      x.lineWidth = 1 + prand(k + 99) * 2;
      const o = prand(k) * L;
      x.beginPath();
      if (vertical){ x.moveTo(o, 0); x.bezierCurveTo(o + 12, h * .3, o - 12, h * .6, o + 6, h); }
      else { x.moveTo(0, o); x.bezierCurveTo(w * .3, o + 12, w * .6, o - 12, w, o + 6); }
      x.stroke();
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const k = clamp(1.75 / camera.aspect, 1, 2.3);
  for (const c of Object.values(CAMS)) c.pos.copy(c.look).add(c.base.clone().sub(c.look).multiplyScalar(k));
  camera.updateProjectionMatrix();
}

// ---------------- 뚝배기 & 국밥 ----------------
function ttukGeo(r, h){
  const pts = [[0, 0], [r * .6, 0], [r * .8, h * .12], [r * .95, h * .45], [r, h * .85], [r * .98, h], [r * .88, h], [r * .86, h * .85], [r * .78, h * .4], [0, h * .3]];
  return new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), 32);
}
function makeSprout(len = .35){
  const g = new THREE.Group();
  g.add(mesh(geo('sprStem' + len, () => { const q = new THREE.CylinderGeometry(.014, .012, len, 5); q.translate(0, len / 2, 0); return q; }), std(0xf4efd6, {roughness: .5}), 0, 0, 0, false));
  g.add(mesh(geo('sprHead', () => new THREE.SphereGeometry(.032, 8, 6)), std(0xf0cf45, {roughness: .5}), 0, len, 0, false));
  return g;
}
function makeFlames(r = .42, n = 10, h = .3){
  const flames = new THREE.Group();
  const fmat = new THREE.MeshBasicMaterial({color: 0xff8a1e, transparent: true, opacity: .9});
  const bmat = new THREE.MeshBasicMaterial({color: 0x3aa0ff, transparent: true, opacity: .9});
  for (let k = 0; k < n; k++){
    const a = k / n * Math.PI * 2;
    const f = new THREE.Mesh(geo('flame' + h, () => { const q = new THREE.ConeGeometry(.07, h, 6); q.translate(0, h / 2, 0); return q; }), k % 2 ? fmat : bmat);
    f.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    flames.add(f);
  }
  return flames;
}

function makeToppingPile(id, R = .3){
  const g = new THREE.Group();
  if (id === 'dadaegi'){
    const m = mesh(new THREE.SphereGeometry(R * .7, 16, 10), std(0xc4221a, {roughness: .6}), 0, 0, 0, false);
    m.scale.y = .45; g.add(m);
  } else if (id === 'buchu'){
    for (let k = 0; k < 9; k++){
      const m = mesh(geo('buchu', () => new THREE.CylinderGeometry(.022, .022, 1, 5)), std(0x3f9a3a), (prand(k) - .5) * R * 1.2, .03, (prand(k + 5) - .5) * R * 1.2, false);
      m.scale.y = R * 1.9; m.rotation.z = Math.PI / 2; m.rotation.y = prand(k + 9) * Math.PI;
      g.add(m);
    }
  } else if (id === 'saeu'){
    for (let k = 0; k < 8; k++) g.add(mesh(geo('saeu', () => new THREE.SphereGeometry(.045, 8, 6)), std(0xf4a38a, {roughness: .4}), (prand(k) - .5) * R * 1.2, .02 + prand(k + 3) * .04, (prand(k + 7) - .5) * R * 1.2, false));
  } else if (id === 'deulkkae'){
    for (let k = 0; k < 22; k++) g.add(mesh(geo('kkae', () => new THREE.SphereGeometry(.025, 6, 4)), std(0xd8c29a), (prand(k) - .5) * R * 1.6, .02, (prand(k + 11) - .5) * R * 1.6, false));
  }
  return g;
}

function makeContents(soupId, tops, R, burnt){
  const g = new THREE.Group();
  const s = soupById(soupId);
  const broth = mesh(new THREE.CircleGeometry(R, 28), std(burnt ? 0x1a1410 : s.broth, {roughness: .2}), 0, 0, 0, false);
  broth.rotation.x = -Math.PI / 2;
  g.add(broth);
  if (burnt) return g;
  // 모든 국밥은 밥이 말아져 나가요
  const rice = mesh(geo('riceMound', () => new THREE.SphereGeometry(1, 16, 10)), std(0xfafaf2, {roughness: .9}), -.05 * R, 0, .05 * R, false);
  rice.scale.set(R * .42, R * .16, R * .42);
  g.add(rice);
  if (soupId === 'bone'){
    for (let k = 0; k < 3; k++){
      const b = makeBonePiece(true);
      tintGroup(b, k === 1 ? 0xb07a52 : 0xc9946a);
      b.scale.setScalar(R * 1.1);
      const a = k / 3 * Math.PI * 2 + .3;
      b.position.set(Math.cos(a) * R * .5, .06, Math.sin(a) * R * .5);
      b.rotation.set(.3, a, .2);
      g.add(b);
    }
    for (let k = 0; k < 5; k++){
      const leaf = mesh(geo('ugeoji', () => new THREE.BoxGeometry(.08, .02, .3)), std(0x5f6e2e), (prand(k + 60) - .5) * R * 1.2, .05, (prand(k + 65) - .5) * R * 1.2, false);
      leaf.rotation.y = prand(k + 70) * 3;
      g.add(leaf);
    }
  } else if (soupId === 'pork'){
    for (let k = 0; k < 5; k++){
      const a = k / 5 * Math.PI * 2 + .5;
      const m = mesh(new THREE.BoxGeometry(R * .42, .035, R * .26), std(0xf2d6bd, {roughness: .6}), Math.cos(a) * R * .45, .02 + k * .006, Math.sin(a) * R * .45, false);
      m.rotation.y = -a + .3;
      g.add(m);
    }
  } else {
    for (let k = 0; k < 16; k++){
      const sp = makeSprout(R * .7);
      sp.rotation.z = Math.PI / 2; sp.rotation.y = prand(k + 70) * Math.PI * 2;
      sp.position.set((prand(k + 80) - .5) * R * 1.1, .03 + k * .003, (prand(k + 90) - .5) * R * 1.1);
      g.add(sp);
    }
  }
  for (let k = 0; k < 6; k++){
    const pa = mesh(geo('pa', () => new THREE.TorusGeometry(.035, .012, 4, 8)), std(0x7cc35a), (prand(k + 40) - .5) * R * 1.3, .06, (prand(k + 50) - .5) * R * 1.3, false);
    pa.rotation.x = Math.PI / 2;
    g.add(pa);
  }
  const spots = {dadaegi: [0, .08, 0], buchu: [-.45, .07, .25], saeu: [.45, .07, .3], deulkkae: [0, .1, 0]};
  tops.forEach(t => {
    const p = makeToppingPile(t, R * .55);
    const sp = spots[t];
    p.position.set(sp[0] * R, sp[1], sp[2] * R);
    g.add(p);
  });
  return g;
}

function makeBowl(soupId, tops, r = .6){
  const g = new THREE.Group();
  const h = r * .9;
  g.add(mesh(new THREE.CylinderGeometry(r * 1.15, r * 1.05, .06, 24), std(0x7a4a26), 0, .03, 0));
  g.add(mesh(ttukGeo(r, h), std(0x3a2a22, {roughness: .45, side: THREE.DoubleSide}), 0, .06, 0));
  const c = makeContents(soupId, tops, r * .84, false);
  c.position.y = .06 + h * .82;
  g.add(c);
  return g;
}

function makeStockPot(x, brothColor){
  const potG = new THREE.Group(); potG.position.set(x, TABLE_TOP + .03, TABLE_Z - .1);
  potG.add(mesh(new THREE.CylinderGeometry(1.1, 1.15, .14, 24), std(0x2a2a2a, {metalness: .5}), 0, .07, 0));
  const flames = makeFlames(.7, 16, .38); flames.position.y = .12; potG.add(flames);
  const pot = new THREE.Group(); pot.position.y = .2; potG.add(pot);
  const steel = std(0xc9d0d5, {metalness: .3, roughness: .3, side: THREE.DoubleSide});
  pot.add(mesh(new THREE.CylinderGeometry(1.05, 1.0, 1.4, 32, 1, true), steel, 0, .7, 0));
  pot.add(mesh(new THREE.CylinderGeometry(1.0, 1.0, .04, 32), steel, 0, .02, 0));
  pot.add(mesh(new THREE.TorusGeometry(1.05, .05, 8, 32), steel, 0, 1.4, 0).rotateX(Math.PI / 2));
  pot.add(mesh(new THREE.BoxGeometry(.25, .12, .5), steel, -1.15, 1.15, 0), mesh(new THREE.BoxGeometry(.25, .12, .5), steel, 1.15, 1.15, 0));
  const broth = mesh(new THREE.CircleGeometry(1.0, 32), new THREE.MeshStandardMaterial({color: brothColor, roughness: .2}), 0, .6, 0, false);
  broth.rotation.x = -Math.PI / 2; pot.add(broth);
  const bubbles = [];
  for (let k = 0; k < 10; k++){
    const b = mesh(geo('bubble2', () => new THREE.SphereGeometry(.09, 8, 6)), std(0xffffff, {transparent: true, opacity: .7, roughness: .1}), 0, 0, 0, false);
    broth.add(b); bubbles.push(b);
  }
  return {potG, flames, pot, broth, bubbles, steamT: 0};
}

function makeBonePiece(spine){
  const b = new THREE.Group();
  if (spine){
    b.add(mesh(geo('vert', () => new THREE.BoxGeometry(.34, .22, .3)), std(0xffffff), 0, 0, 0));
    b.add(mesh(geo('vspike', () => new THREE.ConeGeometry(.08, .3, 6)), std(0xffffff), 0, .22, 0));
    b.add(mesh(geo('vmeat', () => new THREE.SphereGeometry(.15, 10, 8)), std(0xffffff), .12, -.05, .1));
  } else {
    b.add(mesh(geo('bshaft', () => new THREE.CylinderGeometry(.07, .07, .7, 8)), std(0xffffff), 0, 0, 0));
    const endGeo = geo('bend', () => new THREE.SphereGeometry(.13, 10, 8));
    b.add(mesh(endGeo, std(0xffffff), 0, .35, 0), mesh(endGeo, std(0xffffff), 0, -.35, 0));
  }
  return b;
}
function tintGroup(grp, color){
  if (grp.userData.tint === color) return;
  grp.userData.tint = color;
  const m = std(color, {roughness: .55});
  grp.children.forEach(ch => { ch.material = m; });
}
function makeBoneCrate(x, z, spine){
  const g = new THREE.Group(); g.position.set(x, TABLE_TOP + .04, z);
  g.add(mesh(new THREE.BoxGeometry(1.4, .28, .95), std(0x9a6a3a), 0, .14, 0));
  const items = [];
  for (let k = 0; k < 4; k++){
    const b = makeBonePiece(spine);
    if (spine){ b.position.set(-.45 + k * .3, .42 + (k % 2) * .06, (k % 2 - .5) * .3); b.rotation.set(0, k * .9, (k % 2 - .5) * .5); }
    else { b.rotation.set(Math.PI / 2, 0, k * .8); b.position.set(-.45 + k * .3, .38 + (k % 2) * .08, (k % 2 - .5) * .3); }
    g.add(b); items.push(b);
  }
  return {g, items};
}
function sproutPile(parent, n, seed, spread = .7, height = .2){
  const list = [];
  for (let k = 0; k < n; k++){
    const sp = makeSprout(.34);
    sp.position.set((prand(k + seed) - .5) * spread, .05 + prand(k + seed + 10) * height, (prand(k + seed + 20) - .5) * spread);
    sp.rotation.set((prand(k + seed + 30) - .5) * 2.6, prand(k + seed + 40) * 6, (prand(k + seed + 50) - .5) * 2.6);
    parent.add(sp); list.push(sp);
  }
  return list;
}

function buildPrepStation(){
  const P = W.prep = {labels: {}, chopT: 0, fridgeT: 0, washT: 0, washKind: null, hits: [], hov: {}, fridgeOpen: 0};
  const g = P.g = new THREE.Group(); g.visible = false; scene.add(g);
  const top = TABLE_TOP + .04;
  const steel = std(0xc9d0d5, {metalness: .3, roughness: .3, side: THREE.DoubleSide});
  const sliceGeo = geo('slice', () => new THREE.BoxGeometry(.34, .04, .22));

  // 도마 + 돼지고기 + 식칼
  const bx = PREP_X - 1.1, bz = TABLE_Z + .3;
  P.board = new THREE.Group(); P.board.position.set(bx, top, bz); g.add(P.board);
  P.board.add(mesh(new THREE.BoxGeometry(2.3, .14, 1.3), std(0xe3b77f, {roughness: .75}), 0, .07, 0));
  P.block = new THREE.Group(); P.block.position.set(-1.0, .14, 0); P.board.add(P.block);
  P.block.add(mesh(new THREE.BoxGeometry(1.2, .36, .7), std(0xd8736a, {roughness: .5}), .6, .18, 0));
  P.block.add(mesh(new THREE.BoxGeometry(1.2, .12, .7), std(0xf6e6da, {roughness: .5}), .6, .42, 0));
  P.block.add(mesh(new THREE.BoxGeometry(1.21, .04, .71), std(0xf6e6da), .6, .16, 0));
  P.spare = [];
  for (let k = 0; k < 3; k++){
    const sb = new THREE.Group(); sb.position.set(PREP_X - 2.0, top + .2 + k * .47, TABLE_Z - .75);
    sb.add(mesh(new THREE.BoxGeometry(.9, .36, .5), std(0xd8736a, {roughness: .5}), 0, 0, 0));
    sb.add(mesh(new THREE.BoxGeometry(.9, .1, .5), std(0xf6e6da), 0, .23, 0));
    g.add(sb); P.spare.push(sb);
  }
  P.knife = new THREE.Group(); P.knife.position.set(.3, .44, .75); P.board.add(P.knife);
  P.knife.add(mesh(new THREE.BoxGeometry(.03, .32, 1.0), std(0xdfe6ea, {metalness: .6, roughness: .2}), 0, 0, -.85));
  P.knife.add(mesh(new THREE.BoxGeometry(.08, .12, .45), std(0x3a2414), 0, .05, -.12));
  // 썬 고기 접시 (아직 냉장고에 안 넣은 것)
  P.plate = new THREE.Group(); P.plate.position.set(PREP_X + .55, top, TABLE_Z + .85); g.add(P.plate);
  P.plate.add(mesh(new THREE.CylinderGeometry(.55, .45, .06, 24), std(0xf7f7f2, {roughness: .3}), 0, .03, 0));
  P.slices = [];
  for (let k = 0; k < 16; k++){
    const a = k * 2.4;
    const sl = mesh(sliceGeo, std(0xe99a8a, {roughness: .5}), Math.cos(a) * .22 * (k % 3 ? 1 : .3), .08 + k * .025, Math.sin(a) * .22 * (k % 3 ? 1 : .3), false);
    sl.rotation.y = a; P.plate.add(sl); P.slices.push(sl);
  }

  // 냉장고 (항상 보이는 가구)
  const F = P.fridge = new THREE.Group(); F.position.set(8.75, 0, 1.9); scene.add(F);
  const white = std(0xe9eef1, {roughness: .35});
  F.add(mesh(new THREE.BoxGeometry(1.6, 3.4, .06), white, 0, 1.7, -.57));
  F.add(mesh(new THREE.BoxGeometry(.06, 3.4, 1.2), white, -.77, 1.7, 0), mesh(new THREE.BoxGeometry(.06, 3.4, 1.2), white, .77, 1.7, 0));
  F.add(mesh(new THREE.BoxGeometry(1.6, .06, 1.2), white, 0, 3.37, 0), mesh(new THREE.BoxGeometry(1.6, .12, 1.2), white, 0, .06, 0));
  F.add(mesh(new THREE.BoxGeometry(1.46, 3.2, .02), new THREE.MeshStandardMaterial({color: 0xdff4ff, emissive: 0x9fd8ff, emissiveIntensity: .35}), 0, 1.7, -.52, false));
  P.fridgeSlices = [];
  [1.0, 1.85, 2.7].forEach(y => {
    F.add(mesh(new THREE.BoxGeometry(1.46, .04, 1.05), std(0xbfe3f0, {transparent: true, opacity: .7}), 0, y, 0, false));
    for (let k = 0; k < 6; k++){
      const sl = mesh(sliceGeo, std(0xe99a8a, {roughness: .5}), -.55 + k * .22, y + .05, k % 2 ? .1 : -.1, false);
      sl.rotation.y = Math.PI / 2; F.add(sl); P.fridgeSlices.push(sl);
    }
  });
  P.door = new THREE.Group(); P.door.position.set(-.8, 0, .6); F.add(P.door);
  P.door.add(mesh(new THREE.BoxGeometry(1.6, 3.4, .1), white, .8, 1.7, .05));
  P.door.add(mesh(new THREE.BoxGeometry(.07, 1.1, .1), std(0x8a9aa4, {metalness: .4}), 1.45, 1.9, .14));
  P.door.add(mesh(new THREE.BoxGeometry(1.4, .04, .02), std(0xc9d5dc), .8, 2.3, .11));

  // 싱크대
  P.sink = new THREE.Group(); P.sink.position.set(STOVE_X - 3.8, top, TABLE_Z); g.add(P.sink);
  const wall = (w, h, d, x, y, z) => P.sink.add(mesh(new THREE.BoxGeometry(w, h, d), steel, x, y, z));
  wall(1.9, .05, 1.5, 0, .025, 0); wall(1.9, .45, .06, 0, .225, -.72); wall(1.9, .45, .06, 0, .225, .72); wall(.06, .45, 1.5, -.92, .225, 0); wall(.06, .45, 1.5, .92, .225, 0);
  const water = mesh(new THREE.PlaneGeometry(1.78, 1.38), new THREE.MeshStandardMaterial({color: 0x7ec8f0, transparent: true, opacity: .55, roughness: .1}), 0, .28, 0, false);
  water.rotation.x = -Math.PI / 2; P.sink.add(water);
  P.sink.add(mesh(new THREE.CylinderGeometry(.05, .05, .9, 10), steel, 0, .9, -.85));
  P.sink.add(mesh(new THREE.BoxGeometry(.08, .08, .55), steel, 0, 1.33, -.6));
  P.stream = mesh(new THREE.CylinderGeometry(.03, .03, 1.0, 8), new THREE.MeshBasicMaterial({color: 0xaee3ff, transparent: true, opacity: .7}), 0, .82, -.36, false);
  P.sink.add(P.stream);
  P.sinkItems = {kong: new THREE.Group(), bones: makeBonePiece(false), spine: makeBonePiece(true)};
  sproutPile(P.sinkItems.kong, 14, 500, .6, .1);
  tintGroup(P.sinkItems.bones, 0xefe6d2); tintGroup(P.sinkItems.spine, 0xe0bfa6);
  P.sinkItems.bones.rotation.set(Math.PI / 2, 0, .6);
  for (const it of Object.values(P.sinkItems)){ it.position.set(0, .32, .1); P.sink.add(it); }

  // 콩나물: 바구니(안 씻음) → 소쿠리(씻음) → 볼(다듬음)

const LOOKS = {
  worker:   {skin: 0xffd9b3, shirt: 0x2f3d5c, pants: 0x22283a},
  grandpa:  {skin: 0xf2c9a0, shirt: 0x7a5b3a, pants: 0x555555},
  student:  {skin: 0xffdcb8, shirt: 0x4f9d69, pants: 0x3a4a6a},
  hangover: {skin: 0xdfe6b8, shirt: 0xe6e6e6, pants: 0x333333},
  grandma:  {skin: 0xf5cfa8, shirt: 0x8e5b9a, pants: 0x5a4a6a},
  youtuber: {skin: 0xffe0c0, shirt: 0xff7eb3, pants: 0x2d2d4d},
};
const faceCache = {};
function faceTex(kind, mood){
  const key = kind + '|' + mood;
  if (faceCache[key]) return faceCache[key];
  const t = canvasTex(256, 256, (x) => {
    x.lineCap = 'round'; x.lineJoin = 'round';
    const ink = '#2a1a10';
    const dot = (cx, cy, r, c) => { x.fillStyle = c; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); };
    const line = (pts, w = 10, c = ink) => { x.strokeStyle = c; x.lineWidth = w; x.beginPath(); x.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) x.lineTo(pts[i], pts[i + 1]); x.stroke(); };
    const arc = (cx, cy, r, a0, a1, w = 10, c = ink) => { x.strokeStyle = c; x.lineWidth = w; x.beginPath(); x.arc(cx, cy, r, a0, a1); x.stroke(); };
    dot(62, 165, 24, 'rgba(255,110,110,.35)');
    dot(194, 165, 24, 'rgba(255,110,110,.35)');
    const eyes = () => { dot(88, 128, 14, ink); dot(168, 128, 14, ink); dot(93, 122, 5, '#fff'); dot(173, 122, 5, '#fff'); };
    if (mood === 'happy'){ arc(88, 138, 20, Math.PI * 1.15, Math.PI * 1.85, 11); arc(168, 138, 20, Math.PI * 1.15, Math.PI * 1.85, 11); }
    else if (mood === 'worried'){ eyes(); line([60, 104, 110, 88], 9); line([196, 104, 146, 88], 9); x.fillStyle = '#6ec6ff'; x.beginPath(); x.moveTo(218, 60); x.quadraticCurveTo(236, 96, 218, 100); x.quadraticCurveTo(200, 96, 218, 60); x.fill(); }
    else if (mood === 'sick'){ for (const cx of [88, 168]){ x.strokeStyle = ink; x.lineWidth = 5; x.beginPath(); for (let a = 0; a < 14; a += .3){ const r = a * 1.3; x.lineTo(cx + Math.cos(a) * r, 128 + Math.sin(a) * r); } x.stroke(); } }
    else if (mood === 'meh' || mood === 'annoyed'){ line([70, 130, 106, 130], 10); line([150, 130, 186, 130], 10); if (mood === 'annoyed'){ line([62, 108, 110, 116], 8); line([194, 108, 146, 116], 8); } }
    else eyes();
    if (kind === 'grandpa'){ arc(88, 128, 30, 0, Math.PI * 2, 6, '#333'); arc(168, 128, 30, 0, Math.PI * 2, 6, '#333'); line([118, 128, 138, 128], 6, '#333'); x.fillStyle = '#d8d8d8'; x.beginPath(); x.ellipse(128, 168, 40, 13, 0, 0, Math.PI * 2); x.fill(); }
    if (mood === 'happy'){ x.fillStyle = '#8a1f1f'; x.beginPath(); x.arc(128, 178, 32, 0, Math.PI); x.closePath(); x.fill(); dot(128, 198, 12, '#ff7b7b'); }
    else if (mood === 'annoyed') arc(128, 215, 22, Math.PI * 1.25, Math.PI * 1.75, 9);
    else if (mood === 'worried') arc(128, 222, 26, Math.PI * 1.2, Math.PI * 1.8, 9);
    else if (mood === 'sick'){ x.strokeStyle = ink; x.lineWidth = 8; x.beginPath(); x.moveTo(100, 195); x.quadraticCurveTo(114, 183, 128, 195); x.quadraticCurveTo(142, 207, 156, 195); x.stroke(); }
    else if (mood === 'meh') line([108, 195, 148, 195], 9);
    else if (kind !== 'grandpa') arc(128, 170, 24, Math.PI * .15, Math.PI * .85, 9);
    else arc(128, 185, 16, Math.PI * .2, Math.PI * .8, 7);
  });
  faceCache[key] = t;
  return t;
}

function makeCustomer(type){
  const L = LOOKS[type.id];
  const g = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({color: L.skin, roughness: .6});
  const shirt = std(L.shirt), pants = std(L.pants);
  const P = {skinMat};

  const legGeo = geo('leg', () => { const q = new THREE.CylinderGeometry(.15, .13, 1.0, 10); q.translate(0, -.5, 0); return q; });
  P.legL = mesh(legGeo, pants, -.24, 1.0, 0); P.legR = mesh(legGeo, pants, .24, 1.0, 0);
  g.add(P.legL, P.legR);
  g.add(mesh(new THREE.CylinderGeometry(.5, .62, 1.35, 20), shirt, 0, 1.65, 0));
  const sh = mesh(new THREE.SphereGeometry(.52, 20, 12), shirt, 0, 2.28, 0); sh.scale.set(1.15, .45, 1); g.add(sh);
  const armGeo = geo('arm', () => { const q = new THREE.CylinderGeometry(.13, .11, .9, 10); q.translate(0, -.45, 0); return q; });
  P.armL = new THREE.Group(); P.armL.position.set(-.66, 2.25, 0);
  P.armR = new THREE.Group(); P.armR.position.set(.66, 2.25, 0);
  for (const arm of [P.armL, P.armR]){
    arm.add(mesh(armGeo, shirt));
    arm.add(mesh(geo('hand', () => new THREE.SphereGeometry(.13, 10, 8)), skinMat, 0, -.95, 0));
    g.add(arm);
  }
  P.armL.rotation.z = -.15; P.armR.rotation.z = .15;

  const head = new THREE.Group(); head.position.y = 2.95;
  head.add(mesh(new THREE.SphereGeometry(.62, 32, 24), skinMat));
  const earGeo = geo('ear', () => new THREE.SphereGeometry(.12, 10, 8));
  head.add(mesh(earGeo, skinMat, -.61, 0, 0), mesh(earGeo, skinMat, .61, 0, 0));
  const faceMat = new THREE.MeshStandardMaterial({map: faceTex(type.id, type.id === 'hangover' ? 'sick' : 'normal'), transparent: true, depthWrite: false, roughness: .8});
  const face = new THREE.Mesh(geo('face', () => new THREE.SphereGeometry(.628, 32, 16, Math.PI / 2 - .85, 1.7, Math.PI / 2 - .8, 1.55)), faceMat);
  head.add(face);
  head.rotation.x = -.18;
  P.head = head; P.face = face; P.mood = '';
  g.add(head);

  const hair = (color, cut = 1.15) => mesh(new THREE.SphereGeometry(.66, 24, 12, 0, Math.PI * 2, 0, cut), std(color, {roughness: .8}), 0, .04, -.03);
  switch (type.id){
    case 'worker':
      head.add(hair(0x2b2118));
      g.add(mesh(new THREE.BoxGeometry(.16, .7, .06), std(0xc62d1f), 0, 1.95, .56));
      g.add(mesh(new THREE.BoxGeometry(.5, .16, .1), std(0xffffff), 0, 2.33, .42));
      break;
    case 'grandpa': {
      head.add(mesh(new THREE.CylinderGeometry(.6, .66, .26, 24), std(0xbfa37a), 0, .5, -.02));
      const brim = mesh(new THREE.BoxGeometry(.7, .05, .45), std(0xa88c62), 0, .4, .55); brim.rotation.x = .2; head.add(brim);
      break;
    }
    case 'student':
      head.add(hair(0x3a2616));
      head.add(mesh(new THREE.TorusGeometry(.68, .06, 8, 24, Math.PI), std(0x222222), 0, .05, 0));
      head.add(mesh(new THREE.CylinderGeometry(.2, .2, .16, 16), std(0x333333), -.7, 0, 0).rotateZ(Math.PI / 2));
      head.add(mesh(new THREE.CylinderGeometry(.2, .2, .16, 16), std(0x333333), .7, 0, 0).rotateZ(Math.PI / 2));
      g.add(mesh(new THREE.BoxGeometry(.8, .9, .35), std(0xe0a030), 0, 1.75, -.7));
      break;
    case 'hangover':
      head.add(hair(0x5a3b24, 1.0));
      for (let k = 0; k < 6; k++){
        const sp = mesh(geo('spike', () => new THREE.ConeGeometry(.14, .4, 6)), std(0x5a3b24), (prand(k) - .5) * .8, .55, (prand(k + 3) - .5) * .6);
        sp.rotation.set((prand(k + 1) - .5) * 1.2, 0, (prand(k + 2) - .5) * 1.2); head.add(sp);
      }
      { const tie = mesh(new THREE.BoxGeometry(.16, .6, .06), std(0x3a6fd8), .12, 1.95, .56); tie.rotation.z = .35; g.add(tie); }
      break;
    case 'grandma':
      head.add(hair(0xd6d6d6));
      head.add(mesh(new THREE.SphereGeometry(.28, 16, 12), std(0xd6d6d6, {roughness: .8}), 0, .55, -.35));
      g.add(mesh(new THREE.TorusGeometry(.42, .045, 8, 24), std(0xfff8f0, {roughness: .2}), 0, 2.3, .12).rotateX(Math.PI / 2 - .25));
      break;
    case 'youtuber': {
      head.add(mesh(new THREE.SphereGeometry(.67, 24, 12, 0, Math.PI * 2, 0, 1.2), std(0xe0282e), 0, .04, 0));
      const cbrim = mesh(new THREE.BoxGeometry(.6, .05, .5), std(0xe0282e), 0, .38, -.62); cbrim.rotation.x = -.25; head.add(cbrim);
      P.armR.rotation.z = 2.5;
      P.armR.add(mesh(new THREE.CylinderGeometry(.03, .03, 1.0, 6), std(0x222222), 0, -1.4, 0));
      P.armR.add(mesh(new THREE.BoxGeometry(.5, .28, .05), std(0x111111), 0, -1.95, .05));
      P.phoneLight = mesh(new THREE.SphereGeometry(.05, 8, 6), new THREE.MeshBasicMaterial({color: 0xff2244}), .18, -1.95, .1, false);
      P.armR.add(P.phoneLight);
      break;
    }
  }
  g.traverse(o => { if (o.isMesh && o !== face) o.castShadow = true; });
  g.userData = P;
  return g;
}

function emitSteam(pos, dark = false, big = 1){
  if (W.particles.length > 220) return;
  const mat = new THREE.SpriteMaterial({map: W.steamTex, transparent: true, depthWrite: false, opacity: 0, color: dark ? 0x333333 : 0xffffff});
  const s = new THREE.Sprite(mat);
  s.position.copy(pos).add(new THREE.Vector3(rand(-.3, .3), 0, rand(-.3, .3)));
  const size = rand(.4, .7) * big;
  s.scale.setScalar(size);
  scene.add(s);
  W.particles.push({s, life: 0, max: rand(1.2, 1.9), vy: rand(.7, 1.2), vx: rand(-.15, .15), size, alpha: dark ? .8 : .55});
}
function emitCoins(pos){
  for (let k = 0; k < 10; k++){
    const c = mesh(geo('coin', () => new THREE.CylinderGeometry(.14, .14, .04, 14)), std(0xf2b632, {metalness: .8, roughness: .25}), pos.x, pos.y, pos.z, false);
    scene.add(c);
    W.coins.push({m: c, v: new THREE.Vector3(rand(-2.5, 2.5), rand(3, 6), rand(0, 2)), life: 0});
  }
}
function emitDrops(pos, color, n = 8){
  for (let k = 0; k < n; k++){
    const d = mesh(geo('drop', () => new THREE.SphereGeometry(.05, 6, 4)), std(color, {roughness: .2}), pos.x, pos.y, pos.z, false);
    scene.add(d);
    W.coins.push({m: d, v: new THREE.Vector3(rand(-1.5, 1.5), rand(2, 4), rand(-1, 1.5)), life: .3});
  }
}
function tweenArc(obj, to, dur, height, onDone){
  W.tweens.push({obj, from: obj.position.clone(), to: to.clone(), dur, t: 0, height, onDone});
}
function updateFx(dt){
  for (let i = W.particles.length - 1; i >= 0; i--){
    const p = W.particles[i];
    p.life += dt;
    const k = p.life / p.max;
    p.s.position.y += p.vy * dt; p.s.position.x += p.vx * dt;
    p.s.scale.setScalar(p.size * (1 + k * 1.6));
    p.s.material.opacity = Math.sin(Math.min(k, 1) * Math.PI) * p.alpha;
    if (k >= 1){ scene.remove(p.s); p.s.material.dispose(); W.particles.splice(i, 1); }
  }
  for (let i = W.coins.length - 1; i >= 0; i--){
    const c = W.coins[i];
    c.life += dt; c.v.y -= 14 * dt;
    c.m.position.addScaledVector(c.v, dt);
    c.m.rotation.x += dt * 10; c.m.rotation.z += dt * 6;
    if (c.life > 1.0){ scene.remove(c.m); W.coins.splice(i, 1); }
  }
  for (let i = W.tweens.length - 1; i >= 0; i--){
    const tw = W.tweens[i];
    tw.t += dt;
    const k = clamp(tw.t / tw.dur, 0, 1), e = k * k * (3 - 2 * k);
    tw.obj.position.lerpVectors(tw.from, tw.to, e);
    tw.obj.position.y += Math.sin(k * Math.PI) * tw.height;
    if (tw.spin) tw.obj.rotation.y += dt * tw.spin;
    if (k >= 1){ W.tweens.splice(i, 1); tw.onDone && tw.onDone(); }
  }
}

function canPrep(){ return inPhase('prep') && $('overlay').hidden; }

function startGame(){
  const name = ($('shopName')?.value || '').trim() || '할매국밥';
  G = {
    name, day: 1, money: START_MONEY, rep: 3, totalProfit: 0, totalServed: 0, totalPerfect: 0,
    up: {burner: 0, fire: 0, tray: 0, knife: 0, stockpot: 0, kkak: 0, sign: 0},
    phase: 'intro', running: false, paused: false, over: false, custId: 0,
  };
  $('hudName').textContent = '🍲 ' + name;
  sfx.click();
  showDayIntro();
}

function showDayIntro(){
  G.phase = 'intro';
  buildDay();
  setWorldMode('prep');
  const newTops = TOPPINGS.filter(t => t.unlock === G.day && G.day > 1);
  const unlocks = newTops.map(t => `<span class="unlock">🆕 토핑: ${t.icon} ${t.name}</span>`).join('');
  sfx.rooster();
  showOverlay(`
    <div class="card">

      ${goalBar()}

      <div>${unlocks}</div>
      <div style="font-size:16px;color:#8a6e55;margin-top:8px">오늘의 임대료: ${fmt(rentToday())} · 점심 영업 ${DAY_LEN}초</div>

function buildButtons(day){
  $('soups').innerHTML = SOUPS.map((s, i) =>
    `<button class="cbtn" data-soup="${s.id}"><span class="ic">${s.icon}</span>${s.name}<small>&nbsp;</small><span class="key">${keyLabel(SOUP_KEYS[i])}</span></button>`
  ).join('');
  $('toppings').innerHTML = TOPPINGS.map((t, i) => {
    const locked = t.unlock > day;
    return `<button class="cbtn ${locked ? 'locked' : ''}" data-top="${t.id}"><span class="ic">${locked ? '🔒' : t.icon}</span>${t.name}<small>${locked ? `DAY ${t.unlock} 해금` : '&nbsp;'}</small><span class="key">${i + 1}</span></button>`;
  }).join('');
  W.bins.forEach(b => { const locked = topById(b.id).unlock > day; b.lid.visible = locked; b.fill.visible = !locked; });
}

function buildDay(){
  Object.assign(G, {
    time: DAY_LEN, spawnT: 1.2, combo: 0, rushShown: false,
    seats: Array(SEAT_COUNT).fill(null),
    burners: Array.from({length: 2 + G.up.burner}, () => ({state: 'empty'})),
    trays: Array(1 + G.up.tray).fill(null),
    sel: 0,
    raw: {pork: 0, kong: 0, bones: 0, spine: 0},
    stock: {pork: 0, kong: 0, broth: 0, spicy: 0},
    prep: {
      porkChop: 0, porkPart: 0, cut: 0,
      kongWash: 0, washedKong: 0, kongPart: 0,
      bonesWash: 0, washedBones: 0, boil: null,
      spineWash: 0, washedSpine: 0, spicyBoil: null,
      warned: false,
    },
    cart: null,
    stats: {sales: 0, tips: 0, purchase: 0, served: 0, perfect: 0, soldout: 0},
    running: false, paused: false,
  });
  clearCustomers();
  buildBurners(G.burners.length);
  buildTrays(G.trays.length);
  buildButtons(G.day);
  redrawTex(W.menuTex); redrawTex(W.signTex);
}

// ---------------- 새벽 시장 ----------------
function avgInterval(){
  let base = Math.max(3.5, 8.5 - G.day * 0.6);
  base *= (1.25 - G.rep * 0.07);
  if (G.up.sign) base *= 0.8;
  return base;
}
function forecast(){
  const b = avgInterval();
  const n = DAY_LEN * (0.75 / b + 0.25 / (b * 0.6)) + 3;
  return {n: Math.round(n), lo: Math.round(n * .8), hi: Math.round(n * 1.2)};
}
function cartPortions(c){ return {pork: c.pork * 4, kong: c.kong * 5, broth: c.bones * 8, spicy: c.spine * 5}; }
function cartTotal(){ return INGREDIENTS.reduce((s, i) => s + G.cart[i.id] * i.price, 0); }

function showMarket(){
  G.phase = 'market';
  sfx.click();
  const est = forecast();
  if (!G.cart){
    // 추천: 세 메뉴에 손님을 1/3씩, 맑은 육수는 고기+콩나물 인분만큼. 돈이 모자라면 줄이기
    const third = est.n / 3;
    const c = {pork: Math.ceil(third / 4), kong: Math.ceil(third / 5), bones: 0, spine: Math.ceil(third / 5)};
    const fit = () => { c.bones = Math.ceil((c.pork * 4 + c.kong * 5) / 8); };
    const total = () => INGREDIENTS.reduce((s, i) => s + c[i.id] * i.price, 0);
    fit();
    while (total() > G.money && c.pork + c.kong + c.spine > 0){
      const big = [['pork', c.pork * 4], ['kong', c.kong * 5], ['spine', c.spine * 5]].filter(x => c[x[0]] > 0).sort((a, b) => b[1] - a[1])[0][0];
      c[big]--; fit();
    }
    G.cart = c;
  }
  showOverlay(`
    <div class="card wide">
      <h2>🌅 새벽 시장</h2>
      <div class="mk-info">📈 오늘 예상 손님 <b>${est.lo}~${est.hi}명</b> &nbsp;·&nbsp; 🗑️ 남은 재료는 영업이 끝나면 폐기돼요</div>
      <div class="mk-list">${INGREDIENTS.map(ing => `
        <div class="mk-row">
          <div class="mk-ic">${ing.icon}</div>
          <div class="mk-name">${ing.name}<small>${ing.desc}</small></div>
          <div class="mk-price">${fmt(ing.price)} / ${ing.unit}</div>
          <div class="mk-qty"><button class="qty" onclick="cartAdd('${ing.id}',-1)">−</button><span id="q-${ing.id}"></span><button class="qty" onclick="cartAdd('${ing.id}',1)">+</button></div>
          <div class="mk-sub" id="s-${ing.id}"></div>
        </div>`).join('')}
      </div>
      <div class="mk-info" id="mkMake"></div>
      <div class="mk-total">합계 <b id="mkTotal"></b> &nbsp;·&nbsp; 보유 ${fmt(G.money)} → 남는 돈 <b id="mkLeft"></b></div>
      <div class="mk-warn" id="mkWarn"></div>
      <button class="big-btn" id="mkBuy" onclick="buyIngredients()">🛒 사서 주방으로 가기</button>
    </div>`, true);
  updateMarket();
}
function cartAdd(id, d){
  G.cart[id] = clamp(G.cart[id] + d, 0, 20);
  sfx.click();
  updateMarket();
}
function updateMarket(){
  INGREDIENTS.forEach(ing => {
    $('q-' + ing.id).textContent = G.cart[ing.id] + ing.unit;
    $('s-' + ing.id).textContent = fmt(G.cart[ing.id] * ing.price);
  });
  const total = cartTotal(), left = G.money - total, p = cartPortions(G.cart);
  $('mkMake').innerHTML = `준비하면: 🥩 고기 <b>${p.pork}</b> · 🌱 콩나물 <b>${p.kong}</b> · 🍲 맑은 육수 <b>${p.broth}</b> · 🌶️ 매운 육수 <b>${p.spicy}</b>인분 → 최대 <b>${Math.min(p.pork + p.kong, p.broth) + p.spicy}그릇</b>`;
  $('mkTotal').textContent = fmt(total);
  $('mkLeft').textContent = fmt(left);
  let warn = '';
  if (left < 0) warn = '💸 돈이 부족해요!';
  else if (p.broth < p.pork + p.kong) warn = '⚠️ 맑은 육수가 고기·콩나물보다 적어요. 돼지국밥·콩나물국밥엔 맑은 육수가 꼭 필요해요!';
  else if (p.pork + p.kong + p.spicy === 0) warn = '⚠️ 재료가 하나도 없으면 장사를 못 해요!';
  $('mkWarn').textContent = warn;
  $('mkBuy').disabled = left < 0;
}
function buyIngredients(){
  const total = cartTotal();
  if (total > G.money){ sfx.err(); return; }
  G.money -= total;
  G.stats.purchase = total;
  G.raw = {...G.cart};
  G.phase = 'prep';
  hideOverlay();
  setWorldMode('prep');
  sfx.coin();
  toast('🔪 고기는 썰어서 냉장고에! 콩나물·뼈는 씻어서 손질하세요');
}

// ---------------- 재료 준비 ----------------
function chopsPer(){ return G.up.knife ? 1 : 2; }
function blockScale(){
  const partial = (G.prep.porkPart + G.prep.porkChop / chopsPer()) / 4;
  return Math.max(.1, 1 - partial);
}
function prepCan(id){
  const r = G.raw, p = G.prep;
  return {
    chop: r.pork > 0, fridge: p.cut > 0,
    washKong: r.kong > 0, trim: p.washedKong > 0,
    washBones: r.bones > 0, boil: p.washedBones > 0 && !p.boil,
    washSpine: r.spine > 0, spicy: p.washedSpine > 0 && !p.spicyBoil,
  }[id];
}
function flyPiece(obj, from, to, dur = .35){
  obj.position.copy(from);
  scene.add(obj);
  W.tweens.push({obj, from: from.clone(), to: to.clone(), dur, t: 0, height: .8, spin: 10, onDone: () => scene.remove(obj)});
}
function slicePiece(){ return mesh(geo('slice', () => new THREE.BoxGeometry(.34, .04, .22)), std(0xe99a8a, {roughness: .5}), 0, 0, 0, false); }

function prepAction(id){
  if (!canPrep()) return;
  const P = W.prep, r = G.raw, p = G.prep;
  if (id === 'sink') id = r.kong > 0 ? 'washKong' : r.bones > 0 ? 'washBones' : r.spine > 0 ? 'washSpine' : null;
  if (!id){ toast('씻을 재료가 없어요'); sfx.err(); return; }
  if (!prepCan(id)){
    toast({
      chop: '썰 돼지고기가 없어요',
      fridge: '도마 위에 썬 고기가 없어요 (먼저 1번 썰기)',
      washKong: '씻을 콩나물이 없어요',
      trim: r.kong > 0 ? '먼저 콩나물을 씻어주세요! (3번)' : '다듬을 콩나물이 없어요',
      washBones: '씻을 사골뼈가 없어요',
      boil: p.boil ? '맑은 육수가 끓고 있어요... 다른 재료를 손질하세요!' : r.bones > 0 ? '먼저 사골뼈를 씻어주세요! (5번)' : '끓일 사골뼈가 없어요',
      washSpine: '씻을 등뼈가 없어요',
      spicy: p.spicyBoil ? '매운 육수가 끓고 있어요... 다른 재료를 손질하세요!' : r.spine > 0 ? '먼저 등뼈를 씻어주세요! (7번)' : '끓일 등뼈가 없어요',
    }[id]);
    sfx.err();
    return;
  }
  switch (id){
    case 'chop': {
      p.porkChop++; P.chopT = .16; sfx.chop();
      if (p.porkChop >= chopsPer()){
        p.porkChop = 0; p.porkPart++; p.cut++;
        const from = P.board.position.clone().add(new THREE.Vector3(-1.0 + 1.2 * blockScale() + .1, .5, 0));
        flyPiece(slicePiece(), from, P.plate.position.clone().add(new THREE.Vector3(0, .5, 0)));
        if (p.porkPart >= 4){ p.porkPart = 0; r.pork--; }
      }
      break;
    }
    case 'fridge': {
      const n = p.cut;
      G.stock.pork += n; p.cut = 0;
      P.fridgeT = 1.3;
      sfx.whoosh();
      const to = P.fridge.position.clone().add(new THREE.Vector3(0, 1.9, .3));
      for (let k = 0; k < Math.min(n, 6); k++) flyPiece(slicePiece(), P.plate.position.clone().add(new THREE.Vector3(0, .4 + k * .05, 0)), to, .45 + k * .06);
      floatWorld(8.75, 3.9, 1.9, `🧊 고기 ${n}인분 냉장 보관!`, '#aee3ff');
      break;
    }
    case 'washKong': case 'washBones': case 'washSpine': {
      const kind = {washKong: 'kong', washBones: 'bones', washSpine: 'spine'}[id];
      const washKey = kind + 'Wash';
      p[washKey]++;
      P.washT = .7; P.washKind = kind;
      sfx.splash();
      emitDrops(P.sink.position.clone().add(new THREE.Vector3(0, .5, .1)), 0x8fd3ff, 6);
      if (p[washKey] >= WASH_CLICKS[kind]){
        p[washKey] = 0; r[kind]--;
        p[{kong: 'washedKong', bones: 'washedBones', spine: 'washedSpine'}[kind]]++;
        floatWorld(P.sink.position.x, P.sink.position.y + 1.5, P.sink.position.z, {kong: '🌱 콩나물 1봉지 씻기 완료!', bones: '🍖 사골뼈 1세트 씻기 완료!', spine: '🦴 등뼈 1세트 씻기 완료!'}[kind], '#aee3ff');
      }
      break;
    }
    case 'trim': {
      p.kongPart++; G.stock.kong++;
      sfx.pluck();
      const bunch = new THREE.Group();
      sproutPile(bunch, 4, p.kongPart * 7 + G.stock.kong, .2, .05);
      flyPiece(bunch, P.colander.position.clone().add(new THREE.Vector3(0, .4, 0)), P.bowl.position.clone().add(new THREE.Vector3(0, .3, 0)));
      if (p.kongPart >= 5){ p.kongPart = 0; p.washedKong--; }
      break;
    }
    case 'boil': case 'spicy': {
      const washedKey = id === 'boil' ? 'washedBones' : 'washedSpine';
      const sets = Math.min(p[washedKey], 1 + G.up.stockpot);
      p[washedKey] -= sets;
      p[id === 'boil' ? 'boil' : 'spicyBoil'] = {sets, t: 0, dur: G.up.stockpot ? 2.5 : 4};
      sfx.pour();
      const pp = (id === 'boil' ? P.clear : P.spicyPot).potG.position;
      if (id === 'spicy') emitDrops(pp.clone().add(new THREE.Vector3(0, 2.2, 0)), 0xd62a1a, 14);
      floatWorld(pp.x, pp.y + 2.4, pp.z, id === 'boil' ? `🍖 사골뼈 ${sets}세트 투입!` : `🌶️ 등뼈 ${sets}세트 + 매운 양념!`, '#fff3dc');
      break;
    }
  }
}

function updatePrep(dt){
  for (const [key, stockKey, yieldN, potKey, label] of [['boil', 'broth', 8, 'clear', '🍲 맑은 육수'], ['spicyBoil', 'spicy', 5, 'spicyPot', '🌶️ 매운 육수']]){
    const b = G.prep[key];
    if (!b) continue;
    b.t += dt;
    if (b.t >= b.dur){
      G.stock[stockKey] += b.sets * yieldN;
      G.prep[key] = null;
      sfx.ready();
      const pp = W.prep[potKey].potG.position;
      floatWorld(pp.x, pp.y + 2.4, pp.z, `${label} +${b.sets * yieldN}인분 완성!`, '#f2b632');
    }
  }
}
function unfinishedPrep(){
  const r = G.raw, p = G.prep;
  if (p.cut > 0) return '🧊 썬 고기를 냉장고에 안 넣었어요! (그대로 두면 버려져요)';
  if (p.boil || p.spicyBoil) return '⏳ 육수가 아직 끓는 중이에요!';
  if (p.washedKong > 0) return '✂️ 씻어둔 콩나물을 아직 안 다듬었어요!';
  if (p.washedBones > 0 || p.washedSpine > 0) return '🔥 씻은 뼈를 아직 안 끓였어요!';
  if (r.pork + r.kong + r.bones + r.spine > 0) return '⚠️ 손질 안 한 재료가 남았어요!';
  return null;
}
function startLunch(){
  if (!canPrep()) return;
  const msg = unfinishedPrep();
  if (msg && !G.prep.warned){
    G.prep.warned = true;
    toast(msg + ' 한 번 더 누르면 시작');
    sfx.err();
    return;
  }
  for (const [key, stockKey, yieldN] of [['boil', 'broth', 8], ['spicyBoil', 'spicy', 5]]){
    const b = G.prep[key];
    if (b){ G.stock[stockKey] += Math.floor(b.sets * yieldN * b.t / b.dur); G.prep[key] = null; }
  }
  G.phase = 'lunch';
  setWorldMode('lunch');
  G.running = true;
  sfx.bell();
  toast(`☀️ DAY ${G.day} 점심 영업 시작!`);
}

// ---------------- 손님 ----------------
function supply(){
  const prog = {}, need = {};
  SOUPS.forEach(s => { prog[s.id] = 0; need[s.id] = 0; });
  G.burners.forEach(b => { if (b.state === 'cooking' || b.state === 'ready') prog[b.soup]++; });
  G.trays.forEach(t => { if (t) prog[t.soup]++; });
  G.seats.forEach(c => { if (c && c.state === 'waiting') need[c.soup]++; });
  return {prog, need};
}
// 아직 안 만든 주문(ex)에 필요한 재료가 재고보다 많은지(short)
function usage(need, prog){
  const ex = {}, use = {pork: 0, kong: 0, broth: 0, spicy: 0};
  SOUPS.forEach(s => {
    ex[s.id] = Math.max(0, need[s.id] - prog[s.id]);
    for (const k in s.needs) use[k] += ex[s.id] * s.needs[k];
  });
  return {ex, short: Object.keys(use).filter(k => use[k] > G.stock[k])};
}
function canAccept(soupId){
  const {prog, need} = supply();
  need[soupId]++;
  return usage(need, prog).short.length === 0;
}
function checkSoldOut(){
  for (let guard = 0; guard < SEAT_COUNT; guard++){
    const {prog, need} = supply();
    const {ex, short} = usage(need, prog);
    if (!short.length) return;
    let victim = -1;
    G.seats.forEach((c, i) => {
      if (!c || c.state !== 'waiting' || ex[c.soup] === 0) return;
      if (!short.some(k => soupById(c.soup).needs[k])) return;
      if (victim < 0 || c.id > G.seats[victim].id) victim = i;
    });
    if (victim < 0) return;
    const c = G.seats[victim];
    c.state = 'sad'; c.t = 2.0; c.v++;
    c.line = pick(['품절이라니... 다음에 올게요 ㅠ', '에고, 재료가 떨어졌구나~', '아쉽다... 내일 또 올게요']);
    G.combo = 0; G.stats.soldout++;
    addRep(-0.2);
    sfx.sad();
    floatWorld(SEAT_X[victim], 4.1, SEAT_Z, '품절 😢', '#8fb0ff');
  }
}

function spawnCustomer(){
  const free = G.seats.map((s, i) => s ? -1 : i).filter(i => i >= 0);
  if (!free.length) return false;
  const soups = SOUPS.filter(s => canAccept(s.id));
  if (!soups.length) return false;
  const i = pick(free);
  const type = pickWeighted(CUSTOMERS.filter(c => c.minDay <= G.day), c => c.weight);
  const soup = pick(soups);
  const tops = shuffle(unlockedTops().map(t => t.id));
  const maxN = Math.min(tops.length, 1 + Math.floor(G.day / 2));
  const chosen = tops.slice(0, randInt(0, maxN));
  (type.force || []).forEach(f => { if (!chosen.includes(f)) chosen.push(f); });
  chosen.sort((a, b) => topIndex(a) - topIndex(b));
  G.seats[i] = {id: ++G.custId, type, soup: soup.id, tops: chosen, state: 'waiting', line: pick(type.lines), v: 0, t: 0};
  sfx.bell();
  return true;
}

function nextInterval(){
  let base = avgInterval();
  const prog = 1 - G.time / DAY_LEN;
  if (prog > 0.4 && prog < 0.65) base *= 0.6;
  return base * rand(0.7, 1.3);
}

function addRep(d){
  G.rep = clamp(G.rep + d, 0, 5);
  if (G.rep <= 0 && G.running && !G.over){
    G.over = true; G.running = false;
    setTimeout(() => showEnding('rep'), 1200);
  }
}

// ---------------- 점심 영업 행동 ----------------
function orderSoup(id){
  const s = soupById(id);
  if (!s) return;
  const out = Object.keys(s.needs).find(k => G.stock[k] < s.needs[k]);
  if (out){ toast(`${STOCKS[out].icon} ${STOCKS[out].name}이(가) 다 떨어졌어요!`); sfx.err(); return; }
  const b = G.burners.findIndex(b => b.state === 'empty');
  if (b < 0){ toast('빈 가마솥이 없어요!'); sfx.err(); return; }
  G.burners[b] = {state: 'cooking', soup: id, t: 0};
  for (const k in s.needs) G.stock[k] -= s.needs[k];
  sfx.pour();
}

function clickBurner(i){
  const b = G.burners[i];
  if (!b) return;
  if (b.state === 'ready'){
    const t = G.trays[G.sel] === null ? G.sel : G.trays.findIndex(x => x === null);
    if (t < 0){ toast('조립대가 꽉 찼어요! 서빙하거나 버리세요'); sfx.err(); return; }
    const from = W.burnerViews[i].g.position, to = W.trayViews[t].g.position;
    const fly = makeBowl(b.soup, [], .6);
    fly.position.set(from.x, from.y + .6, from.z);
    scene.add(fly);
    const soup = b.soup;
    G.burners[i] = {state: 'empty'};
    W.trayViews[t].pendingKey = true;
    tweenArc(fly, new THREE.Vector3(to.x, to.y + .1, to.z), .35, 1.2, () => { scene.remove(fly); W.trayViews[t].pendingKey = false; });
    G.trays[t] = {soup, tops: []};
    G.sel = t;
    sfx.whoosh();
  } else if (b.state === 'burnt'){
    G.burners[i] = {state: 'empty'};
    sfx.trash(); toast('탄 국밥을 버렸어요 😢');
  } else if (b.state === 'cooking'){
    toast('아직 끓는 중이에요... 🔥');
  } else {
    toast('👇 아래 국밥 버튼을 눌러서 끓이세요');
  }
}

function toggleTop(id){
  const t = topById(id);
  if (!t) return;
  if (t.unlock > G.day){ toast(`🔒 DAY ${t.unlock}에 해금돼요`); sfx.err(); return; }
  const tr = G.trays[G.sel];
  if (!tr){ toast('조립대에 그릇이 없어요! 가마솥에서 옮겨오세요'); sfx.err(); return; }
  const k = tr.tops.indexOf(id);
  if (k >= 0) tr.tops.splice(k, 1); else tr.tops.push(id);
  tr.tops.sort((a, b) => topIndex(a) - topIndex(b));
  const bin = W.bins.find(b => b.id === id);
  if (bin) bin.bounce = 1;
  sfx.click();
}

function trashTray(){
  if (!G.trays[G.sel]) return;
  const p = W.trayViews[G.sel].g.position;
  for (let k = 0; k < 4; k++) emitSteam(new THREE.Vector3(p.x, p.y + .5, p.z), true, .8);
  G.trays[G.sel] = null;
  sfx.trash();
  switchToFilledTray();
}

function switchToFilledTray(){
  const j = G.trays.findIndex(x => x !== null);
  if (j >= 0) G.sel = j;
}

function serve(i){
  const c = G.seats[i];
  if (!c || c.state !== 'waiting') return;
  const tr = G.trays[G.sel];
  const hx = SEAT_X[i], hy = 4.1, hz = SEAT_Z;
  if (!tr){ toast('서빙할 국밥이 없어요! 조립대에 그릇을 준비하세요'); sfx.err(); return; }
  if (tr.soup !== c.soup){
    c.line = '이거 제가 시킨 거 아닌데요?'; c.v++;
    const v = W.seatViews[i]; if (v) v.shakeT = .5;
    sfx.err(); floatWorld(hx, hy, hz, '메뉴가 달라요!', '#ff6b5b');
    return;
  }
  const missing = c.tops.filter(t => !tr.tops.includes(t)).length;
  const extra = tr.tops.filter(t => !c.tops.includes(t)).length;
  const mistakes = missing + extra;
  const s = soupById(c.soup);
  let price = s.price;
  let tip = 1500 * c.type.tip * (1 + 0.4 * G.up.kkak);
  let msg, color = '#f2b632';

  if (mistakes === 0){
    G.combo++;
    tip *= 1 + Math.min(G.combo - 1, 10) * 0.1;
    G.stats.perfect++;
    addRep(c.type.vip ? 0.5 : 0.08);
    msg = G.combo >= 2 ? `완벽! 콤보 x${G.combo}` : '완벽해요!';
    c.face = '😋';
    c.line = pick(['캬~ 이 맛이지!','국밥은 역시 여기!','잘 먹었습니다!','또 올게요!','뜨끈~하다!']);
    if (c.type.vip) toast('🤳 유튜버가 극찬했어요! 평판 대폭 상승!');
  } else if (mistakes === 1){
    G.combo = 0; tip *= 0.3;
    msg = '조금 아쉬워요'; color = '#ffd27a';
    c.face = '🙂'; c.line = missing ? '뭐가 하나 빠졌네요...' : '이건 안 시켰는데...';
    if (c.type.vip){ addRep(-0.3); toast('🤳 유튜버: "음... 쏘쏘하네요"'); }
  } else {
    G.combo = 0; tip = 0; price = Math.round(s.price * 0.7);
    msg = '주문이랑 너무 달라요'; color = '#ff8a7a';
    c.face = '😒'; c.line = '다음엔 제대로 주세요...';
    addRep(c.type.vip ? -0.7 : -0.15);
    if (c.type.vip) toast('🤳 유튜버가 혹평 영상을 올렸어요...');
  }
  tip = Math.round(tip / 100) * 100;
  G.money += price + tip;
  G.stats.sales += price; G.stats.tips += tip; G.stats.served++;

  const tv = W.trayViews[G.sel], v = W.seatViews[i];
  const bowl = makeBowl(tr.soup, tr.tops, .6);
  bowl.position.copy(tv.g.position).add(new THREE.Vector3(0, .1, 0));
  scene.add(bowl);
  tweenArc(bowl, new THREE.Vector3(SEAT_X[i], COUNTER_TOP, -.75), .45, 2.2, () => { if (mistakes === 0) emitCoins(new THREE.Vector3(SEAT_X[i], 3.2, SEAT_Z + .5)); });
  if (v){ if (v.bowl) scene.remove(v.bowl); v.bowl = bowl; } else setTimeout(() => scene.remove(bowl), 2000);

  G.trays[G.sel] = null;
  switchToFilledTray();
  c.state = 'happy'; c.t = 2.0; c.v++;
  floatWorld(hx, hy, hz, '+' + fmt(price + tip), '#f2b632');
  floatWorld(hx, hy, hz, msg, color, 34);
  sfx.coin();
}

// ---------------- 영업 업데이트 ----------------
function update(dt){
  if (G.time > 0){
    G.time -= dt;
    if (!G.rushShown && G.time < DAY_LEN * 0.6){ G.rushShown = true; toast('🔥 점심 러시! 손님이 몰려와요!'); }
    if (G.time <= 0){ G.time = 0; toast('🔔 영업 마감! 남은 손님만 받아요'); }
  }
  if (G.time > 0){
    G.spawnT -= dt;
    if (G.spawnT <= 0) G.spawnT = spawnCustomer() ? nextInterval() : 0.8;
  }
  const ct = cookTime();
  G.burners.forEach(b => {
    if (b.state === 'cooking'){
      b.t += dt;
      if (b.t >= ct){ b.state = 'ready'; b.t = 0; sfx.ready(); }
    } else if (b.state === 'ready'){
      b.t += dt;
      if (b.t >= BURN_TIME){ b.state = 'burnt'; sfx.burnt(); toast('💨 국밥이 타버렸어요!'); }
    }
  });
  G.seats.forEach((c, i) => {
    if (c && c.state !== 'waiting'){
      c.t -= dt;
      if (c.t <= 0) G.seats[i] = null;
    }
  });
  checkSoldOut();
  if (G.time > 0){
    const {prog} = supply();
    if (!SOUPS.some(s => canAccept(s.id)) && prog.pork + prog.kong === 0){
      G.time = 0;
      toast('🥲 재료가 다 떨어졌어요! 남은 손님만 받고 마감해요');
    }
  }
  if (G.time <= 0 && G.seats.every(s => !s) && G.running) endDay();
}
